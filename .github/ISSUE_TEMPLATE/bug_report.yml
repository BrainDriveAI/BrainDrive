name: Bug report
description: Report a reproducible problem with BrainDrive
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BrainDrive.

        Use this form for reproducible bugs. For setup help, questions, and feature ideas, use the [BrainDrive community forum](https://community.braindrive.ai). Report security vulnerabilities privately through [GitHub Private Vulnerability Reporting](https://github.com/BrainDriveAI/BrainDrive/security/advisories/new).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed API keys, tokens, passwords, personal data, and other secrets from this report.
          required: true

  - type: input
    id: version
    attributes:
      label: BrainDrive version
      description: Provide the release tag, version shown in the app, or commit SHA.
      placeholder: "Example: 26.7.23 or 1a2b3c4"
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: Install mode
      description: How is the affected BrainDrive instance installed or run?
      options:
        - Docker — local
        - Docker — production
        - Docker — development
        - Desktop application (Tauri)
        - Managed or hosted
        - Other or custom
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the host operating system and, for web issues, the browser and version.
      placeholder: "Example: Ubuntu 24.04, Docker 28.3; Firefox 141"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Start BrainDrive with ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error text when safe.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant, redacted log lines. Do not include credentials, personal memory, or private conversations.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, configuration details, or other context that may help reproduce the problem.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [BrainDrive Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true

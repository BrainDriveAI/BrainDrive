name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: builds/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builds/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  web-client:
    name: Web client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: builds/typescript/client_web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builds/typescript/client_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  mcp-release:
    name: MCP release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: builds/mcp_release
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builds/mcp_release/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build --file installer/docker/Dockerfile.app --tag braindrive-app:ci .

      - name: Verify production dependencies
        run: |
          docker run --rm --entrypoint sh braindrive-app:ci -c '
            for binary in \
              /app/typescript/node_modules/@tauri-apps/cli \
              /app/typescript/node_modules/eslint \
              /app/typescript/node_modules/tsx \
              /app/typescript/node_modules/typescript-eslint \
              /app/typescript/node_modules/vitest \
              /app/typescript/node_modules/.bin/eslint \
              /app/typescript/node_modules/.bin/tauri \
              /app/typescript/node_modules/.bin/tsx \
              /app/typescript/node_modules/.bin/vitest \
              /app/mcp_release/node_modules/tsx \
              /app/mcp_release/node_modules/vitest \
              /app/mcp_release/node_modules/.bin/tsx \
              /app/mcp_release/node_modules/.bin/vitest
            do
              test ! -e "$binary"
            done
          '

      - name: Build edge image
        run: docker build --file installer/docker/Dockerfile.edge --tag braindrive-edge:ci .

  installer-integrity:
    name: Installer integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify bootstrap archive integrity
        run: installer/bootstrap/test/bootstrap-integrity.sh

      - name: Verify cosign auto-install integrity
        run: installer/docker/scripts/test/cosign-auto-install-integrity.sh

      - name: Verify signed first-install resolution
        run: installer/docker/scripts/test/install-release-resolution.sh

      - name: Verify production auth bootstrap
        run: installer/docker/scripts/test/install-prod-bootstrap.sh

      - name: Verify canonical GHCR namespace
        run: installer/docker/scripts/test/ghcr-namespace.sh

      - name: Verify image hardening
        run: installer/docker/scripts/test/image-hardening.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify scanner safeguards
        run: tools/security/scan-secrets.sh --self-test

      - name: Scan current repository content
        run: tools/security/scan-secrets.sh --current

      - name: Scan reachable Git history
        run: tools/security/scan-secrets.sh --history

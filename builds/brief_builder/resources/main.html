<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Brief Builder</title>
  <style>
    :root{color-scheme:dark;--bg:#03050a;--panel:#0a152a;--surface:#131f33;--surface-2:#1e2a3b;--text:#c5daed;--muted:#7ca7d1;--heading:#fff;--amber:#f5a623;--border:#294564;--danger:#f5365c;--success:#2dce89}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.shell{width:min(100%,1040px);margin:auto;padding:clamp(16px,3vw,32px)}h1,h2,h3{color:var(--heading)}h1{margin:.2rem 0}.intro{margin:.45rem 0 0;color:var(--text)}.eyebrow{margin:0;color:var(--muted);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}.workspace{height:max(540px,calc(100vh - 190px));margin-top:22px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--panel)}.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--border);background:rgba(3,5,10,.28)}.tab{position:relative;min-width:110px;border:0;background:transparent;color:var(--muted);padding:11px 16px 13px;font:inherit;font-weight:700;cursor:pointer}.tab[aria-selected="true"]{color:var(--heading)}.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--amber)}.tab .count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:6px;border-radius:10px;background:var(--surface-2);color:var(--text);font-size:.72rem}.status-wrap{padding:10px clamp(18px,3vw,30px) 0}.status{min-height:24px;margin:0;color:var(--muted);font-size:.9rem}.error{color:var(--danger)}.success{color:var(--success)}.content{flex:1;min-height:0;overflow:auto;padding:18px clamp(18px,3vw,32px) 28px}.view-heading{margin:0 0 4px;font-size:1.05rem}.support,.hint{color:var(--muted);font-size:.875rem}.hint{margin:5px 0 0}label{display:block;margin:14px 0 7px;color:var(--heading);font-weight:700}textarea,input{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);padding:12px;font:inherit}textarea{resize:vertical}.source-editor{height:calc(100% - 86px);min-height:300px;resize:none}.brief-document{max-width:780px;margin:0 auto;padding:clamp(20px,4vw,42px);border:1px solid var(--border);border-radius:12px;background:var(--bg);box-shadow:0 18px 45px rgba(0,0,0,.18)}.brief-document h2{margin:0 0 20px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.2}.opening{margin:0;padding:0 0 22px;border-bottom:1px solid var(--border);color:var(--heading);font-size:1.08rem;line-height:1.7}.key-points{margin:24px 0 0;padding-left:1.3rem}.key-points li{margin:0 0 13px;padding-left:.25rem;line-height:1.6}.citation{display:inline-grid;place-items:center;min-width:25px;height:22px;margin-left:5px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font:700 .72rem/1 system-ui;vertical-align:middle;cursor:pointer}.citation:hover{border-color:var(--amber);color:var(--amber)}details.evidence{max-width:780px;margin:14px auto 0;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}details.evidence summary{padding:12px 15px;color:var(--heading);font-weight:700;cursor:pointer}.evidence-list{margin:0;padding:0 18px 15px;list-style:none}.evidence-list li{padding:11px 0;border-top:1px solid var(--border)}.quote{margin:5px 0 0;color:var(--muted);font-size:.875rem}.empty{display:grid;min-height:100%;place-content:center;text-align:center}.empty h2{margin:0}.editor,.search-view{max-width:780px;margin:0 auto}.markdown-editor{min-height:330px;line-height:1.65}.validation{min-height:22px;margin:6px 0 0;color:var(--danger);font-size:.85rem}.cap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.cap,.result,.read-panel{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:12px}.cap strong,.result strong{color:var(--heading)}.meta{margin:4px 0 0;color:var(--muted);font-size:.8rem}.results{display:grid;gap:10px;margin:14px 0}.result-title{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.result-url{overflow-wrap:anywhere;color:var(--muted);font-size:.82rem}.snippet{margin:7px 0 0}.read-content{max-height:180px;overflow:auto;white-space:pre-wrap;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:10px}.actions{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px clamp(18px,3vw,32px);border-top:1px solid var(--border);background:rgba(10,21,42,.97);box-shadow:0 -12px 28px rgba(3,5,10,.28)}.btn{min-height:42px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:9px 15px;font:inherit;cursor:pointer}.btn.primary{border-color:var(--amber);background:var(--amber);color:var(--bg);font-weight:800}.btn.danger{border-color:var(--danger);color:#ff9aad}.btn:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}textarea.source-highlight{border-color:var(--amber);box-shadow:0 0 0 2px rgba(245,166,35,.16)}@media(max-width:620px){.shell{padding:10px}.workspace{height:calc(100vh - 150px);min-height:520px;margin-top:14px}.tabs{padding-left:8px}.tab{min-width:92px}.content{padding:14px}.brief-document{padding:20px}.actions{padding:12px 14px}.actions .btn{flex:1 1 auto}.intro{font-size:.9rem}.cap-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">BrainDrive App</p>
    <h1>Brief Builder</h1>
    <p class="intro">Turn source material into a concise, supported brief you can review and approve.</p>
    <section class="workspace" aria-label="Brief Builder workspace">
      <nav class="tabs" role="tablist" aria-label="Brief workspace">
        <button class="tab" id="tab-source" role="tab" aria-controls="panel-source" aria-selected="true" type="button">Source</button>
        <button class="tab" id="tab-brief" role="tab" aria-controls="panel-brief" aria-selected="false" type="button">Brief <span class="count" id="brief-count" hidden>0</span></button>
        <button class="tab" id="tab-search" role="tab" aria-controls="panel-search" aria-selected="false" type="button">Search</button>
      </nav>
      <div class="status-wrap"><p id="status" class="status" role="status" aria-live="polite">Ready for source text.</p></div>
      <div id="content" class="content" role="tabpanel" aria-labelledby="tab-source"></div>
      <footer id="actions" class="actions"></footer>
    </section>
  </main>
  <script>
  (()=>{"use strict";
    const content=document.getElementById("content"),actions=document.getElementById("actions"),status=document.getElementById("status"),sourceTab=document.getElementById("tab-source"),briefTab=document.getElementById("tab-brief"),searchTab=document.getElementById("tab-search"),briefCount=document.getElementById("brief-count"),pending=new Map(),rpcPending=new Map();
    let source="",draft=null,catalogRevision=0,busy=false,rpcSequence=0,activeTab="source",editMode=false,editorValid=true,editorValue="",searchQuery="",searchEnvelope=null,readEnvelope=null,selectedReadIndex=null,internetRunId=null,searchDiscovery={};
    const esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]));
    const id=()=>{const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
    const request=(type,payload)=>new Promise((resolve,reject)=>{const messageId=id();pending.set(messageId,{resolve,reject});parent.postMessage({bridge_version:1,message_id:messageId,type,payload},"*")});
    const send=(capability,input)=>request("capability.call",{capability,input}).then(response=>response?.result??response);
    const discover=operationId=>request("capability.discover",{operation_id:operationId}).then(response=>response?.result??response);
    const rpcRequest=(method,params)=>new Promise((resolve,reject)=>{const requestId=`brief-view-${++rpcSequence}`;rpcPending.set(requestId,{resolve,reject});parent.postMessage({jsonrpc:"2.0",id:requestId,method,params},"*")});
    const rpcNotify=(method,params)=>parent.postMessage({jsonrpc:"2.0",method,params},"*");
    const setStatus=(message,kind="status")=>{status.textContent=message;status.className=kind==="status"?"status":`status ${kind}`};
    const markdownFromDraft=()=>draft?draft.statements.map((statement,index)=>`${index===0?"":"- "}${statement.text}`).join("\n"):"";
    const parseMarkdown=value=>{const lines=value.split("\n").map(line=>line.trim()).filter(Boolean);if(!draft||lines.length!==draft.statements.length||lines.slice(1).some(line=>!/^[-*]\s+\S/.test(line)))return null;return lines.map((line,index)=>index===0?line:line.replace(/^[-*]\s+/,""))};
    function bind(idValue,event,handler){document.getElementById(idValue)?.addEventListener(event,handler)}
    function switchTab(next){activeTab=next;editMode=false;render();if(next==="search")void refreshSearchDiscovery(false)}
    function showSource(statementIndex){activeTab="source";editMode=false;render();const statement=draft?.statements[statementIndex];if(!statement||statement.support.kind!=="source_quote"){setStatus("This statement uses owner-provided context rather than a source passage.");return}requestAnimationFrame(()=>{const editor=document.getElementById("source"),start=source.indexOf(statement.support.quote);if(!(editor instanceof HTMLTextAreaElement)||start<0)return;editor.focus();editor.setSelectionRange(start,start+statement.support.quote.length);editor.classList.add("source-highlight");setStatus(`Supporting passage ${statementIndex+1} selected in Source.`)})}
    function updateTabs(){sourceTab.setAttribute("aria-selected",String(activeTab==="source"));briefTab.setAttribute("aria-selected",String(activeTab==="brief"));searchTab.setAttribute("aria-selected",String(activeTab==="search"));content.id=activeTab==="source"?"panel-source":activeTab==="brief"?"panel-brief":"panel-search";content.setAttribute("aria-labelledby",activeTab==="source"?"tab-source":activeTab==="brief"?"tab-brief":"tab-search");briefCount.hidden=!draft;briefCount.textContent=String(draft?.statements.length??0)}
    function renderSource(){content.innerHTML=`<h2 class="view-heading">Source material</h2><p class="hint">Paste only the material the brief may use. Imported web reads stay labeled as untrusted source material.</p><label for="source">Owner source text</label><textarea class="source-editor" id="source" maxlength="32768">${esc(source)}</textarea>`;bind("source","input",event=>source=event.target.value)}
    function citation(index){return `<button class="citation" data-cite="${index}" type="button" aria-label="Show source for statement ${index+1}">${index+1}</button>`}
    function renderEvidence(){return `<details class="evidence"><summary>View supporting sources (${draft.statements.length})</summary><ol class="evidence-list">${draft.statements.map((statement,index)=>`<li><strong>Statement ${index+1}</strong>${citation(index)}<p class="quote">${esc(statement.support.kind==="source_quote"?`“${statement.support.quote}”`:`Owner context: ${statement.support.context}`)}</p></li>`).join("")}</ol></details>`}
    function renderPreview(){const opening=draft.statements[0],points=draft.statements.slice(1);content.innerHTML=`<article class="brief-document" aria-label="Brief preview"><h2>${esc(draft.title)}</h2><p class="opening">${esc(opening.text)} ${citation(0)}</p>${points.length?`<h3>Key points</h3><ul class="key-points">${points.map((statement,index)=>`<li>${esc(statement.text)} ${citation(index+1)}</li>`).join("")}</ul>`:""}</article>${renderEvidence()}`;content.querySelectorAll("[data-cite]").forEach(button=>button.addEventListener("click",()=>showSource(Number(button.getAttribute("data-cite")))))}
    function renderEditor(){if(!editorValue)editorValue=markdownFromDraft();content.innerHTML=`<div class="editor"><h2 class="view-heading">Edit brief</h2><p class="hint">Use one opening line followed by one “-” bullet per key point. Supporting citations stay attached in the same order.</p><label for="title">Title</label><input id="title" maxlength="160" value="${esc(draft.title)}"><label for="brief-markdown">Brief</label><textarea class="markdown-editor" id="brief-markdown" maxlength="12288" aria-describedby="edit-validation">${esc(editorValue)}</textarea><p class="validation" id="edit-validation" aria-live="polite"></p>${renderEvidence()}</div>`;bind("title","input",event=>draft.title=event.target.value);bind("brief-markdown","input",event=>{editorValue=event.target.value;const parsed=parseMarkdown(editorValue);editorValid=Boolean(parsed);if(parsed)parsed.forEach((text,index)=>draft.statements[index].text=text);document.getElementById("edit-validation").textContent=editorValid?"":`Keep one opening line and ${Math.max(0,draft.statements.length-1)} bullet lines so every citation remains attached.`;renderActions()});content.querySelectorAll("[data-cite]").forEach(button=>button.addEventListener("click",()=>showSource(Number(button.getAttribute("data-cite")))))}
    function renderBrief(){if(!draft){content.innerHTML=`<div class="empty"><h2>No brief yet</h2><p class="hint">Add source material, then generate a grounded brief.</p></div>`;return}editMode?renderEditor():renderPreview()}
    function capCard(operationId,label){const item=searchDiscovery[operationId];return `<div class="cap"><strong>${label}</strong><p class="meta">${esc(operationId)}</p><p class="meta">State: ${esc(item?.state??"unknown")} · Callable: ${item?.callable===true?"yes":"no"}</p><p class="meta">${esc(item?.message??"Capability state has not been loaded.")}</p></div>`}
    function failureView(envelope){const failure=envelope?.failure;if(!failure)return "";return `<p class="meta error">Failure: ${esc(failure.code)} · ${esc(failure.message)} · Retryable: ${failure.retryable===true?"yes":"no"}</p>`}
    function providerView(envelope){return envelope?.provider?`${esc(envelope.provider.attribution)} · ${esc(envelope.provider.profile)}`:"No provider attribution"}
    function renderSearchResults(){const results=Array.isArray(searchEnvelope?.results)?searchEnvelope.results:[];if(!searchEnvelope)return "";if(searchEnvelope.status==="success"&&results.length===0)return `<p class="hint">Search completed with empty success.</p>`;return `<div class="results">${results.map((item,index)=>`<article class="result"><div class="result-title"><strong>${esc(item.title)}</strong><button class="btn" data-read="${index}" type="button" ${busy?"disabled":""}>Read</button></div><p class="result-url">${esc(item.url)}</p><p class="snippet">${esc(item.snippet??"")}</p><p class="meta">Source: ${esc(item.source)} · Retrieved: ${esc(item.retrieved_at)} · Freshness: ${esc(item.freshness)} · Class: ${esc(item.result_class)}</p></article>`).join("")}</div>`}
    function renderRead(){if(!readEnvelope)return "";const result=readEnvelope.result;return `<section class="read-panel" aria-label="Read envelope"><h3>Read result</h3><p class="meta">Status: ${esc(readEnvelope.status)} · Retrieved: ${esc(readEnvelope.retrieved_at)} · Provider: ${providerView(readEnvelope)}</p>${failureView(readEnvelope)}${result?`<p class="result-url">${esc(result.canonical_url)}</p><p class="meta">Trust: ${esc(result.trust)} · Class: ${esc(result.result_class)} · Content type: ${esc(result.content_type)} · Truncated: ${result.truncated?"yes":"no"}</p><pre class="read-content">${esc(result.content)}</pre>`:"<p class=\"hint\">No readable content returned.</p>"}</section>`}
    function renderSearch(){content.innerHTML=`<div class="search-view"><h2 class="view-heading">Internet Search</h2><p class="hint">Generic web.search@1 and web.read@1 consumption. Selected reads are imported as external-untrusted source material.</p><div class="cap-grid">${capCard("web.search@1","Search capability")}${capCard("web.read@1","Read capability")}</div><label for="search-query">Search query</label><input id="search-query" maxlength="512" value="${esc(searchQuery)}"><p class="meta">Search envelope: ${esc(searchEnvelope?.status??"not run")} · Provider: ${providerView(searchEnvelope)} ${searchEnvelope?.retrieved_at?`· Retrieved: ${esc(searchEnvelope.retrieved_at)}`:""}</p>${failureView(searchEnvelope)}${renderSearchResults()}${renderRead()}</div>`;bind("search-query","input",event=>searchQuery=event.target.value);content.querySelectorAll("[data-read]").forEach(button=>button.addEventListener("click",()=>readResult(Number(button.getAttribute("data-read")))))}
    function renderActions(){if(activeTab==="source"){actions.innerHTML=`<button class="btn primary" id="generate" type="button" ${busy?"disabled":""}>${draft?"Generate again":"Generate brief"}</button>${draft?'<button class="btn" id="view-brief" type="button">View brief</button>':""}`;bind("generate","click",generate);bind("view-brief","click",()=>switchTab("brief"));return}if(activeTab==="search"){const canSearch=searchDiscovery["web.search@1"]?.callable===true;const canImport=readEnvelope?.status&&readEnvelope.result?.trust==="external-untrusted";actions.innerHTML=`<button class="btn" id="refresh-search" type="button" ${busy?"disabled":""}>Refresh availability</button><button class="btn primary" id="run-search" type="button" ${busy||!searchQuery.trim()||!canSearch?"disabled":""}>Run search</button><button class="btn" id="import-read" type="button" ${busy||!canImport?"disabled":""}>Import read content</button>`;bind("refresh-search","click",()=>refreshSearchDiscovery(true));bind("run-search","click",runSearch);bind("import-read","click",importReadContent);return}if(!draft){actions.innerHTML='<button class="btn primary" id="add-source" type="button">Add source</button>';bind("add-source","click",()=>switchTab("source"));return}actions.innerHTML=`<button class="btn primary" id="approve" type="button" ${busy||!editorValid?"disabled":""}>Review and approve</button><button class="btn" id="toggle-edit" type="button" ${!editorValid?"disabled":""}>${editMode?"Preview":"Edit"}</button><button class="btn" id="retry" type="button" ${busy?"disabled":""}>Generate again</button><button class="btn danger" id="reject" type="button" ${busy?"disabled":""}>Reject draft</button>`;bind("approve","click",approve);bind("toggle-edit","click",()=>{editMode=!editMode;if(!editMode)editorValue=markdownFromDraft();render()});bind("retry","click",generate);bind("reject","click",rejectDraft)}
    function render(){updateTabs();activeTab==="source"?renderSource():activeTab==="brief"?renderBrief():renderSearch();renderActions()}
    async function refreshSearchDiscovery(force){if(busy||(!force&&searchDiscovery["web.search@1"]&&searchDiscovery["web.read@1"]))return;busy=true;setStatus("Checking Internet Search availability.");renderActions();try{const [search,read]=await Promise.all([discover("web.search@1"),discover("web.read@1")]);searchDiscovery={"web.search@1":search,"web.read@1":read};setStatus("Internet Search availability loaded.");render()}catch{searchDiscovery={"web.search@1":{state:"unavailable",callable:false,message:"Search discovery is unavailable."},"web.read@1":{state:"unavailable",callable:false,message:"Read discovery is unavailable."}};setStatus("Internet Search availability could not be loaded.","error");render()}finally{busy=false;renderActions()}}
    async function runSearch(){if(busy||!searchQuery.trim())return;busy=true;setStatus("Calling web.search@1.");renderActions();try{internetRunId=internetRunId??id();readEnvelope=null;selectedReadIndex=null;searchEnvelope=await send("web.search@1",{request_id:id(),run_id:internetRunId,input:{query:searchQuery,max_results:5}});setStatus(searchEnvelope.status==="success"?"Search completed.":"Search returned a typed failure.",searchEnvelope.status==="success"?"success":"error");render()}catch{setStatus("Search call failed safely.","error")}finally{busy=false;renderActions()}}
    async function readResult(index){const result=searchEnvelope?.results?.[index];if(busy||!result)return;busy=true;selectedReadIndex=index;setStatus("Calling web.read@1.");renderActions();try{internetRunId=internetRunId??id();readEnvelope=await send("web.read@1",{request_id:id(),run_id:internetRunId,input:{url:result.url}});setStatus(readEnvelope.status==="success"||readEnvelope.status==="partial"?"Read envelope received.":"Read returned a typed failure.",readEnvelope.status==="success"||readEnvelope.status==="partial"?"success":"error");render()}catch{setStatus("Read call failed safely.","error")}finally{busy=false;renderActions()}}
    function untrustedSourceMaterial(result,envelope){return ["External untrusted source material",`Trust: ${result.trust}`,`Requested URL: ${result.requested_url}`,`Canonical URL: ${result.canonical_url}`,`Title: ${result.title??"Unavailable"}`,`Retrieved at: ${envelope.retrieved_at}`,`Provider attribution: ${envelope.provider?.attribution??"Unavailable"}`,"",result.content].join("\n")}
    function importReadContent(){const result=readEnvelope?.result;if(!result||result.trust!=="external-untrusted")return;const imported=untrustedSourceMaterial(result,readEnvelope);source=[source.trim(),imported].filter(Boolean).join("\n\n---\n\n").slice(0,32768);activeTab="source";editMode=false;setStatus("External untrusted source material imported as plain source text.","success");render()}
    async function generate(){if(busy||!source.trim())return;busy=true;setStatus("Generating through the protected no-tools path…");renderActions();try{const result=await send("app.inference.request",{purpose_id:"brief.generate",version:1,input:{source_text:source,owner_context:[]}});draft=result.draft;catalogRevision=result.catalog_revision;activeTab="brief";editMode=false;editorValid=true;editorValue=markdownFromDraft();setStatus("Brief ready. Review the document and its supporting sources.");render()}catch(error){setStatus(error instanceof Error&&error.message==="protocol_incompatible"?"Your selected BrainDrive model is not yet compatible with Brief Builder. Choose a compatible model in BrainDrive Settings.":"The brief could not be generated safely. Your last approved brief is unchanged.","error")}finally{busy=false;renderActions()}}
    async function approve(){if(busy||!draft||!editorValid)return;busy=true;setStatus("Saving your review before BrainDrive confirmation…");renderActions();try{const edited=await send("brief.records.write",{action:"edit",source_revision_id:draft.source_revision_id,title:draft.title,statements:draft.statements,expected_catalog_revision:catalogRevision});draft=edited.draft;catalogRevision=edited.catalog_revision;setStatus("Waiting for BrainDrive owner confirmation…");const result=await send("brief.approvals.confirm",{action:"approve",draft_revision_id:draft.draft_revision_id,expected_catalog_revision:catalogRevision});setStatus(`Approved revision ${result.approved_revision_id}.`,"success")}catch{setStatus("Approval was not completed. The prior approved revision is unchanged.","error")}finally{busy=false;renderActions()}}
    function rejectDraft(){if(busy||!draft)return;draft=null;activeTab="source";editMode=false;editorValue="";setStatus("The draft was rejected. Your prior approved revision is unchanged.");render()}
    sourceTab.addEventListener("click",()=>switchTab("source"));briefTab.addEventListener("click",()=>switchTab("brief"));searchTab.addEventListener("click",()=>switchTab("search"));
    window.addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc==="2.0"&&message.id!==undefined&&!message.method){const active=rpcPending.get(message.id);if(!active)return;rpcPending.delete(message.id);message.error?active.reject(message.error):active.resolve(message.result);return}if(message?.jsonrpc==="2.0"&&message.method==="ui/resource-teardown"){for(const active of pending.values())active.reject(new Error("session_closed"));pending.clear();parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");return}if(message?.type==="host.result"){const active=pending.get(message.request_message_id);if(!active)return;pending.delete(message.request_message_id);const errorCode=message?.error?.code,validErrorCode=typeof errorCode==="string"&&/^[a-z][a-z0-9_]{0,95}$/.test(errorCode);message.error?active.reject(new Error(validErrorCode?errorCode:"safe_failure")):active.resolve(message.response)}});
    async function connect(){await rpcRequest("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Brief Builder",version:"1.2.0",title:"Brief Builder"},appCapabilities:{availableDisplayModes:["inline"]}});rpcNotify("ui/notifications/initialized",{});await request("bridge.ready",{supported_capabilities:["brief.records.read","brief.records.write","brief.approvals.confirm","app.inference.request","web.search@1","web.read@1"]});const result=await send("brief.records.read",{action:"reopen"});source=result.source?.text??"";draft=result.draft??null;catalogRevision=result.catalog_revision??0;activeTab=draft?"brief":"source";editorValue=markdownFromDraft();setStatus(draft?"Reopened your saved draft.":"Ready for source text.");render()}
    render();
    connect().catch(()=>setStatus("The secure app connection is unavailable. Your saved work is unchanged.","error"));
  })();
  </script>
</body>
</html>

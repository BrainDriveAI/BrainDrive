<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Brief Builder</title>
  <style>
    :root{color-scheme:dark;--bg:#03050a;--panel:#0a152a;--surface:#1e2a3b;--text:#c5daed;--muted:#7ca7d1;--heading:#fff;--amber:#f5a623;--border:#294564;--danger:#f5365c;--success:#2dce89}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.shell{max-width:920px;margin:auto;padding:clamp(16px,4vw,40px)}h1,h2{color:var(--heading)}h1{margin:.2rem 0}.eyebrow{color:var(--muted);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}.panel{margin-top:24px;padding:clamp(18px,3vw,30px);border:1px solid var(--border);border-radius:12px;background:var(--panel)}label{display:block;margin:14px 0 7px;color:var(--heading);font-weight:700}textarea,input{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:12px;font:inherit}textarea{min-height:180px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{min-height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:10px 16px;font:inherit;cursor:pointer}.btn.primary{border-color:var(--amber);background:var(--amber);color:var(--bg);font-weight:700}.btn:disabled{opacity:.5;cursor:not-allowed}.statement{margin:12px 0;padding:14px;border-left:3px solid var(--amber);background:var(--surface)}.support{color:var(--muted);font-size:.875rem}.status{color:var(--muted)}.error{color:var(--danger)}.success{color:var(--success)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}@media(max-width:520px){.shell{padding:12px}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">BrainDrive App</p><h1>Brief Builder</h1>
    <p>Turn your source into a concise, reviewable brief. Nothing becomes approved until you confirm it in BrainDrive.</p>
    <section class="panel" aria-labelledby="brief-heading"><h2 id="brief-heading">Your brief</h2><p id="status" class="status" role="status" aria-live="polite">Ready for source text.</p><div id="content"></div></section>
  </main>
  <script>
  (()=>{"use strict";
    const content=document.getElementById("content"),status=document.getElementById("status"),pending=new Map(),rpcPending=new Map();
    let source="",draft=null,catalogRevision=0,busy=false,rpcSequence=0;
    const esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const id=()=>{const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
    const request=(type,payload)=>new Promise((resolve,reject)=>{const messageId=id();pending.set(messageId,{resolve,reject});parent.postMessage({bridge_version:1,message_id:messageId,type,payload},"*")});
    const send=(capability,input)=>request("capability.call",{capability,input}).then(response=>response?.result??response);
    const rpcRequest=(method,params)=>new Promise((resolve,reject)=>{const requestId=`brief-view-${++rpcSequence}`;rpcPending.set(requestId,{resolve,reject});parent.postMessage({jsonrpc:"2.0",id:requestId,method,params},"*")});
    const rpcNotify=(method,params)=>parent.postMessage({jsonrpc:"2.0",method,params},"*");
    const render=()=>{if(!draft){content.innerHTML=`<label for="source">Owner source text</label><textarea id="source" maxlength="32768" aria-describedby="source-help">${esc(source)}</textarea><p id="source-help" class="support">Paste only the material the brief may use. Web research is not available.</p><div class="row"><button class="btn primary" id="generate" type="button">Generate grounded brief</button></div>`;document.getElementById("source").addEventListener("input",e=>source=e.target.value);document.getElementById("generate").addEventListener("click",generate);return}content.innerHTML=`<label for="title">Brief title</label><input id="title" maxlength="160" value="${esc(draft.title)}">${draft.statements.map((s,i)=>`<div class="statement"><label for="statement-${i}">Statement ${i+1}</label><textarea id="statement-${i}" maxlength="1024">${esc(s.text)}</textarea><p class="support">Support: ${esc(s.support.kind==="source_quote"?s.support.quote:`Owner context: ${s.support.context}`)}</p></div>`).join("")}<div class="row"><button class="btn primary" id="approve" type="button">Review and approve in BrainDrive</button><button class="btn" id="retry" type="button">Generate again</button><button class="btn" id="reject" type="button">Reject this draft</button></div>`;document.getElementById("title").addEventListener("input",e=>draft.title=e.target.value);draft.statements.forEach((s,i)=>document.getElementById(`statement-${i}`).addEventListener("input",e=>s.text=e.target.value));document.getElementById("approve").addEventListener("click",approve);document.getElementById("retry").addEventListener("click",generate);document.getElementById("reject").addEventListener("click",rejectDraft)};
    async function generate(){if(busy||!source.trim())return;busy=true;status.textContent="Generating through the protected no-tools path…";try{const result=await send("app.inference.request",{purpose_id:"brief.generate",version:1,input:{source_text:source,owner_context:[]}});draft=result.draft;catalogRevision=result.catalog_revision;status.textContent="Review every statement and its support before approval.";render()}catch{status.textContent="The brief could not be generated safely. Your last approved brief is unchanged.";status.className="error"}finally{busy=false}}
    async function approve(){if(busy||!draft)return;busy=true;status.textContent="Saving your review before BrainDrive confirmation…";try{const edited=await send("brief.records.write",{action:"edit",source_revision_id:draft.source_revision_id,title:draft.title,statements:draft.statements,expected_catalog_revision:catalogRevision});draft=edited.draft;catalogRevision=edited.catalog_revision;status.textContent="Waiting for BrainDrive owner confirmation…";const result=await send("brief.approvals.confirm",{action:"approve",draft_revision_id:draft.draft_revision_id,expected_catalog_revision:catalogRevision});status.textContent=`Approved revision ${result.approved_revision_id}.`;status.className="success"}catch{status.textContent="Approval was not completed. The prior approved revision is unchanged.";status.className="error"}finally{busy=false}}
    function rejectDraft(){if(busy||!draft)return;draft=null;status.textContent="The draft was rejected. Your prior approved revision is unchanged.";status.className="status";render()}
    window.addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc==="2.0"&&message.id!==undefined&&!message.method){const active=rpcPending.get(message.id);if(!active)return;rpcPending.delete(message.id);message.error?active.reject(message.error):active.resolve(message.result);return}if(message?.jsonrpc==="2.0"&&message.method==="ui/resource-teardown"){for(const active of pending.values())active.reject(new Error("session_closed"));pending.clear();parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");return}if(message?.type==="host.result"){const active=pending.get(message.request_message_id);if(!active)return;pending.delete(message.request_message_id);message.error?active.reject(new Error("safe_failure")):active.resolve(message.response)}});
    async function connect(){await rpcRequest("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Brief Builder",version:"1.0.0",title:"Brief Builder"},appCapabilities:{availableDisplayModes:["inline"]}});rpcNotify("ui/notifications/initialized",{});await request("bridge.ready",{supported_capabilities:["brief.records.read","brief.records.write","brief.approvals.confirm","app.inference.request"]});const result=await send("brief.records.read",{action:"reopen"});source=result.source?.text??"";draft=result.draft??null;catalogRevision=result.catalog_revision??0;status.textContent=draft?"Reopened your saved draft.":"Ready for source text.";render()}
    render();
    connect().catch(()=>{status.textContent="The secure app connection is unavailable. Your saved work is unchanged.";status.className="error"});
  })();
  </script>
</body>
</html>

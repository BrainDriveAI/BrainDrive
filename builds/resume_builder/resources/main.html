<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">BrainDrive · Career workspace</p><h1>Resume Builder</h1><p id="identity" class="muted">Loading your saved work…</p><span class="sr">Start with what BrainDrive already knows</span></div><span id="connection" class="status" role="status">Connecting securely…</span></header>
    <div id="alert" class="alert" role="alert" hidden></div>
    <div class="layout">
      <nav class="steps" aria-label="Resume progress" id="steps"></nav>
      <section class="panel" id="panel" tabindex="-1" aria-live="polite"><p>Connecting to BrainDrive…</p></section>
      <aside class="snapshot" id="fact-snapshot" aria-label="Resume evidence ledger"><p class="muted">Loading confirmed facts…</p></aside>
    </div>
  </main>
  <script>
  (()=>{
    "use strict";
    const APP_ID="ai.braindrive.resume-builder";
    const TOPICS=["contact","direction","employment","accomplishments","education","credentials","skills","projects","leadership_volunteer","links"];
    const JOB_DIMENSIONS=["responsibilities","accomplishments","outcomes","tools","scope","progression"],JOB_PRIORITY=["accomplishments","outcomes","scope","tools","progression","responsibilities"],METRIC_DIMENSIONS=new Set(["accomplishments","outcomes","scope"]),VALUE_CATEGORY={responsibilities:"core_responsibility",accomplishments:"distinct_accomplishment",outcomes:"decision_useful_outcome",tools:"tools_in_use",scope:"scope_or_scale",progression:"progression"};
    const RECOVERY_SETTLE_MS=1500,RECOVERY_ACK_TIMEOUT_MS=500;
    const FRICTION_RELEASE_GATE={open_question:"RB7-OQ-2",status:"numeric_gate_blocked",semantic_limits:{redundant_confirmation_count:0,non_fact_dialog_count:0,final_approval_count:1,confirmation_group_count:"at_most_one_per_submission"}};
    const STAGES=["preflight","interview","fact_review","general_review","job","evidence","tailored_review","revision","preview","history"];
    const LABELS={preflight:"Known information",interview:"Your experience",fact_review:"Review your information",general_review:"General resume",job:"Target job",evidence:"How you match",tailored_review:"Resume for this job",revision:"Revise",preview:"Preview & export",history:"History"};
    const state={boot:null,context:null,facts:[],workspace:null,stage:"preflight",topic:null,repeatTopic:null,repeatReturnsToReview:false,coaching:null,employmentDraft:null,editFactId:null,pendingJobRevisionId:null,jobDimension:null,jobOpportunity:null,jobHistory:[],jobQuestion:null,jobAssistStatus:"idle",addingJob:false,sessionId:null,lastSubmittedTurnRevisionId:null,chatSyncDigest:null,chatPendingText:null,pending:new Map(),rpcPending:new Map(),rpcSequence:0,busy:false,error:null,dialogue:{assistantMessage:null,status:"idle",lastFailedMessage:null,lastFailedMessageId:null,lastFailedContext:null,suggestedAction:"none"},jobAnalysis:null,evidence:null,targetFit:null,preview:null,guidance:null,remembered:null,impact:null,revision:null,pendingCareerReturn:null,interactionDiagnostics:{confirmation_group_count:0,confirmation_unit_count:0,redundant_confirmation_count:0,non_fact_dialog_count:0,final_approval_count:0,timing_class:"human",release_gate:FRICTION_RELEASE_GATE},comparison:{selectedRevisionIds:[],result:null,status:"idle",expandedUnchanged:false},recovery:{timer:null,slot:null,value:"",valueDigest:null,status:"idle",ackRevision:null,ackAt:null,ackValueDigest:null,operationId:null,serverDraft:null,restorePending:false}};
    const $=id=>document.getElementById(id); const panel=$("panel");
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const uuid=()=>{const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
    function sha256Hex(value){

      const constants=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

      return "sha256:"+Array.from(hash,word=>word.toString(16).padStart(8,"0")).join("");
    }
    function envelope(type,payload,messageId=uuid()){return {bridge_version:1,message_id:messageId,type,payload}}
    function request(type,payload,options={}){const message=envelope(type,payload,options.messageId||uuid());return new Promise((resolve,reject)=>{let timer=null;if(options.timeout){timer=setTimeout(()=>{state.pending.delete(message.message_id);reject({error:"deadline_exceeded",ambiguous:true})},options.timeout)}state.pending.set(message.message_id,{resolve,reject,timer});parent.postMessage(message,"*")})}
    function rpcRequest(method,params){const id=`view-${++state.rpcSequence}`;return new Promise((resolve,reject)=>{state.rpcPending.set(id,{resolve,reject});parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
    function rpcNotify(method,params){parent.postMessage({jsonrpc:"2.0",method,params},"*")}
    async function connectBridge(){const initialized=await rpcRequest("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Resume Builder",version:"4.1.0",title:"Resume Builder"},appCapabilities:{availableDisplayModes:["inline"]}});state.boot={entry_point:initialized?.hostContext?.entryPoint==="career"?"career":"direct"};rpcNotify("ui/notifications/initialized",{});await request("bridge.ready",{supported_capabilities:[]});await reload()}
    async function capability(name,input,requestOperationId=null,timeout=null){const response=await request("capability.call",{capability:name,input,...(requestOperationId?{request_operation_id:requestOperationId}:{})},{timeout});return response?.result??response}
    function setBusy(value){state.busy=value;render();if(value)panel.querySelectorAll("button").forEach(button=>{button.disabled=true})}
    function fail(error){state.busy=false;state.error=ownerError(error);render();$("alert").focus?.()}
    function ownerError(error){const code=String(error?.error||error?.code||"unavailable");const copy={conflict:"Your saved version changed elsewhere. Refresh and review before trying again.",model_incompatible:"Your active model is not yet compatible with this resume action. Choose a compatible model in BrainDrive Settings, then retry.",protocol_incompatible:"Your active model is not yet compatible with this resume action. Choose a compatible model in BrainDrive Settings, then retry.",provider_unavailable:"No compatible active model is available. Review BrainDrive Settings, then retry.",denied:"Your active provider needs attention. Review BrainDrive Settings, then retry.",quota_exceeded:"Your active provider has no available quota. Review its account, then retry.",rate_limited:"Your active provider is busy. Wait briefly, then retry.",deadline_exceeded:"The model request timed out. Your saved work is unchanged; retry when ready.",schema_validation_failed:"The model returned an invalid structured result. Your saved work is unchanged; retry when ready.",validation_failed:"Some wording is not supported by confirmed facts. Review the factual warnings and correct it.",cancelled:"The action was cancelled. Your last approved resume is unchanged.",session_closed:"The secure app session closed. Return to Apps and launch it again.",recoverable_internal_failure:"Resume Builder is temporarily unavailable. Your saved work is preserved; retry when ready."};const recovery=error?.recovery||(["model_incompatible","protocol_incompatible","provider_unavailable","denied"].includes(code)?"open_model_settings":null);return {code,message:copy[code]||"Resume Builder could not complete that action. Your saved work is preserved.",recovery}}
    function careerReturnOperationId(summary){const value=sha256Hex(`resume-career-return-v2|${JSON.stringify(summary)}`).slice(7).split("");value[12]="4";value[16]=["8","9","a","b"][parseInt(value[16],16)%4];const hex=value.join("");return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20,32)}`}
    async function retryCareerReturn(){if(!state.pendingCareerReturn)return;try{setBusy(true);const summary=state.pendingCareerReturn;await request("career.return",{summary},{messageId:careerReturnOperationId(summary)});state.pendingCareerReturn=null;state.busy=false;state.error={message:"Career now references the same approved resume and quality status."};render();focusPanel()}catch(error){state.busy=false;state.error={message:"The approved resume is safe, but Career was not updated. Retry sends the same approved identity and status.",recovery:"retry_career_return"};render();$("alert").focus?.()}}
    function structuredValue(value){try{const parsed=JSON.parse(value);return parsed&&typeof parsed==="object"&&!Array.isArray(parsed)?parsed:null}catch{return null}}
    function topicForFact(fact){if(fact.fact_kind==="contact")return fact.value.startsWith("Professional link:")?"links":"contact";if(fact.fact_kind==="preference")return "direction";if(fact.fact_kind==="employment")return "employment";if(fact.fact_kind==="accomplishment")return "accomplishments";if(fact.fact_kind==="education")return "education";if(fact.fact_kind==="credential")return "credentials";if(fact.fact_kind==="skill")return "skills";if(fact.fact_kind==="job_evidence"){const value=structuredValue(fact.value);return value?.association==="general"&&value.dimension==="tools"&&value.outcome==="answered"?"skills":null}if(fact.fact_kind==="project")return fact.value.startsWith("Leadership or volunteer:")?"leadership_volunteer":"projects";return null}

    function renderRevision(){const revision=state.revision;if(!revision){renderRevisionForm();return}const request=revision.request,source=revisionSource();if(!source){panel.innerHTML='<h2>Revision unavailable</h2><p>The exact source version is unavailable. No substitute was selected.</p>';return}if(revision.mode==="submitted"){panel.innerHTML=`<h2>Revision request saved</h2><p>Your private request is durable and tied to approved version ${source.metadata.revision}. Classification has not completed.</p><div class="row"><button class="btn primary" id="revision-retry-classify">Retry classification</button><button class="btn" id="revision-return">Return to approved resume</button></div>`;$("revision-retry-classify").onclick=()=>void classifyRevision();$("revision-return").onclick=()=>{state.stage="preview";render()};return}if(revision.mode==="clarification_needed"){panel.innerHTML=`<h2>One clarification is needed</h2><div class="card warning"><p>${esc(request.clarification||revision.clarification||"Please make the requested scope and change more specific.")}</p></div><p>No proposal or factual change was created.</p><div class="row"><button class="btn primary" id="revision-clearer">Start a clearer request</button><button class="btn" id="revision-return">Return to approved resume</button></div>`;$("revision-clearer").onclick=()=>{state.revision=null;renderRevision()};$("revision-return").onclick=()=>{state.stage="preview";render()};return}if(revision.mode==="awaiting_confirmation"){panel.innerHTML=`<h2>Confirm factual meaning before generation</h2><div class="card warning"><p>This ${esc(request.classification)} request could change factual meaning. BrainDrive will use only confirmed facts and will still create an unapproved proposal.</p><p>${esc(request.request_text)}</p></div><div class="row"><button class="btn primary" id="revision-confirm-facts">Confirm and generate proposal</button><button class="btn" id="revision-return">Not now</button></div>`;$("revision-confirm-     async function loadPreview(definition){try{setBusy(true);state.preview=await capability("resume.export.request",{action:"preview",definition_revision_id:definition.metadata.revision_id});state.guidance=null;state.busy=false;render()}catch(error){fail(error)}}
    function deterministicGuidance(definition){const supported=definition.statements.filter(statement=>statement.supporting_confirmed_fact_revision_ids?.length).slice(0,3),items=supported.map(statement=>({category:"strong_evidence",evidence_revision_ids:statement.supporting_confirmed_fact_revision_ids,evidence_labels:[`${String(statement.section_id).replaceAll("_"," ")} evidence`],message:`Confirmed evidence supports: ${statement.text}`}));if(!definition.statements.some(statement=>statement.section_id==="summary"))items.push({category:"missing_detail",evidence_revision_ids:[],evidence_labels:["Resume summary"],message:"There is not enough confirmed information for a useful summary yet; leaving it out is appropriate."});items.push({category:"intentional_omission",evidence_revision_ids:[],evidence_labels:["Owner choices"],message:"Skipped or intentionally omitted information remains outside the resume."});return {guidance_version:1,items,optional_questions:[]}}
    async function loadGuidance(definition){try{setBusy(true);const findings={findings:definition.statements.some(statement=>statement.section_id==="summary")?[]:[{code:"missing_detail",evidence_revision_ids:[],safe_message:"A supported summary is not available."}]};state.guidance=await infer("resume_guidance",{fact_revision_ids:definition.selected_fact_revision_ids,record_revision_ids:[definition.metadata.revision_id],derived_blocks:[{category:"deterministic_findings",schema_id:"resume.quality-findings.v1",data:findings}]})}catch{state.guidance=deterministicGuidance(definition)}finally{state.busy=false;render()}}
    function renderGuidance(){if(!state.guidance)return "";const labels={strong_evidence:"Strong evidence",missing_detail:"Useful missing detail",unresolved_conflict:"Unresolved conflict",unsupported_requirement:"Unsupported requirement",intentional_omission:"Intentional omission"};return `<section aria-labelledby="guidance-heading"><h3 id="guidance-heading">Strengths and evidence gaps</h3><p class="muted">This guidance describes available evidence. It is optional and does not score or predict outcomes.</p>${Object.entries(labels).map(([category,label])=>{const items=state.guidance.items.filter(item=>item.category===category);return `<div class="card"><h3>${label}</h3>${items.length?`<ul class="list">${items.map(item=>`<li>${esc(item.message)} <span class="small muted">Evidence: ${esc(item.evidence_labels.join(", "))}</span></li>`).join("")}</ul>`:"<p class=\"muted\">None identified.</p>"}</div>`}).join("")}${state.guidance.optional_questions.length?`<h3>Optional next questions</h3><ol class="list">${state.guidance.optional_questions.slice(0,3).map(item=>`<li>${esc(item.prompt)}</li>`).join("")}</ol>`:""}</section>`}
    function previewLineClass(line,index,lines){if(index===0)return "resume-name";const sections=["Summary","Experience","Education","Certifications","Skills","Projects","Leadership","Volunteer","Links"];if(sections.includes(line))return "section";const priorSections=lines.slice(0,index).filter(item=>sections.includes(item));return priorSections.at(-1)==="Experience"&&!line.startsWith("- ")?"job-heading":""}
    function renderPreview(){const definition=targeted(true)||general(true);if(!definition){state.stage="general_review";render();return}if(!state.preview){panel.innerHTML=`<h2>Preview approved resume</h2><p>Preview is rendered by BrainDrive from the approved version. Rendered bytes are not the source of truth.</p><div class="row"><button class="btn primary" id="preview" ${state.busy?'disabled':''}>Create preview</button><button class="btn" id="revision-start">Revise in your own words</button><button class="btn" id="remembered-start">Add remembered detail</button></div>`;$("preview").onclick=()=>void loadPreview(definition);$("revision-start").onclick=beginRevision;$("remembered-start").onclick=beginRemembered;return}const allowed=new Set(state.preview.parity?.allowed_side_effects||["preview","copy","text_export","pdf_export","career_projection"]),pdfReady=state.preview.pdf?.status!=="unavailable"&&allowed.has("pdf_export"),previewReady=allowed.has("preview"),copyReady=allowed.has("copy"),textReady=allowed.has("text_export"),parityPassed=state.preview.parity?.status!=="blocked";panel.innerHTML=`<div class="row between"><div><h2>Preview</h2><p class="muted">${esc(state.preview.definition.kind)} · ${esc(state.preview.definition.revision_label)}${pdfReady?` · ${state.preview.page_count} page${state.preview.page_count===1?"":"s"}`:" · Clean-text recovery"}</p></div><span class="status">${parityPassed?(pdfReady?"All representations verified · Local extraction passed":"PDF unavailable — clean text ready"):"Affected action blocked safely"}</span></div>${previewReady&&pdfReady?`<div class="resume" aria-label="Resume preview">${state.preview.lines.map((line,index,lines)=>`<p class="${previewLineClass(line,index,lines)}">${esc(line)}</p>`).join("")}</div>`:`<div class="card warning"><h3>${previewReady?"PDF preview is unavailable":"Preview parity did not pass"}</h3><p>${esc(state.preview.parity?.recovery||"Your approved resume remains available below. No content was regenerated.")}</p></div>`}<label for="clean-text">Clean resume text — ${esc(state.preview.definition.revision_label)}</label><textarea id="clean-text" readonly aria-describedby="clean-text-help">${esc(state.preview.clean_text.text)}</textarea><p id="clean-text-help" class="small muted">${esc(state.preview.clean_text.instructions)}</p><div class="row"><button class="btn primary" id="copy-text" ${copyReady?'':'disabled'}>Copy clean text</button><button class="btn" id="export-text" ${textReady?'':'disabled'}>Export .txt</button>${pdfReady?`<button class="btn" id="export">Export PDF</button>`:""}<button class="btn" id="guidance">Review strengths and gaps</button><button class="btn" id="history">History</button><button class="btn" id="revision-start">Revise in your own words</button><button class="btn" id="remembered-start">Add remembered detail</button></div>${renderGuidance()}<p class="small muted">BrainDrive confirms Copy and export actions. Resume Builder never receives a filesystem path. A parity mismatch blocks only the affected action; the approved source remains unchanged. If a verified convenience fails, select the text above and copy it manually.</p>`;$("history").onclick=()=>{state.stage="history";render()};$("revision-start").onclick=beginRevision;$("remembered-start").onclick=beginRemembered;$("guidance").onclick=()=>void loadGuidance(definition);$("copy-text").onclick=()=>void request("host.action",{action:"copy_to_clipboard",value:state.preview.clean_text.text}).then(()=>{state.error={message:"Clean text copied. The approved resume remains saved."};render()}).catch(error=>{state.error={message:"Copy was unavailable. The clean text remains selected and ready for manual copy."};render()});$("export-text").onclick=()=>void request("export.request",{format:"text",definition_revision_id:definition.metadata.revision_id,safe_filename:"resume.txt",destination_intent:"new_download",overwrite_confirmed:false}).then(result=>{state.error={message:`Text export ready: ${result.s     function definitionHistory(){return (state.workspace?.definition_history||state.workspace?.definitions||[]).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at)||b.metadata.revision-a.metadata.revision)}
    function comparisonJobLabel(definition){if(definition.definition_kind!=="targeted")return "General resume";const job=(state.workspace?.job_history||state.workspace?.jobs||[]).find(item=>item.metadata.revision_id===definition.job_revision_id);return job?.safe_label?`Target: ${job.safe_label}`:"Targeted resume"}
    function comparisonVersionLabel(definition){return `${definition.title} · ${definition.definition_kind} · ${comparisonJobLabel(definition)} · ${definition.status} · ${new Date(definition.updated_at).toLocaleString()} · Version ${definition.metadata.revision}`}
    function renderComparisonItems(label,items){if(!items.length)return "";return `<section class="card"><h3>${label}</h3><ul class="comparison-list">${items.map(item=>{const before=item.before,after=item.after;if(label==="Added statement")return `<li>${esc(after?.text||"Statement added")}</li>`;if(label==="Removed statement")return `<li>${esc(before?.text||"Statement removed")}</li>`;if(label==="Changed statement")return `<li><strong>Before:</strong> ${esc(before?.text||"")}<br><strong>After:</strong> ${esc(after?.text||"")}</li>`;if(label==="Moved statement")return `<li>${esc(after?.text||before?.text||"Statement")} — moved from position ${(item.before_index??0)+1} to ${(item.after_index??0)+1}</li>`;return `<li>${esc(after?.text||before?.text||"Statement")} — Evidence references changed from ${before?.supporting_confirmed_fact_revision_ids?.length||0} to ${after?.supporting_confirmed_fact_revision_ids?.length||0}.</li>`}).join("")}</ul></section>`}
    function renderComparisonResult(definitions){const result=state.comparison.result,left=definitions.find(item=>item.metadata.revision_id===result?.left_revision_id),right=definitions.find(item=>item.metadata.revision_id===result?.right_revision_id);if(!result||!left||!right){state.comparison={selectedRevisionIds:[],result:null,status:"idle",expandedUnchanged:false};renderHistory();return}if(result.result==="unavailable"){panel.innerHTML=`<h2 id="comparison-heading" tabindex="-1">Compare resume versions</h2><div class="card warning"><h3>These versions cannot be compared</h3><p>The selected immutable versions are unrelated or have incompatible resume kinds or job targets. No substitute version was selected.</p></div><div class="comparison-grid"><div class="card"><h3>Earlier selected version</h3><p>${esc(comparisonVersionLabel(left))}</p></div><div class="card"><h3>Later selected version</h3><p>${esc(comparisonVersionLabel(right))}</p></div></div><button class="btn" id="comparison-back">Back to history</button>`;$("comparison-back").onclick=clearComparison;$("comparison-heading").focus({preventScroll:true});return}const expanded=state.comparison.expandedUnchanged,hasChanges=result.added.length+result.removed.length+result.changed.length+result.moved.length+result.evidence_changed.length>0;panel.innerHTML=`<h2 id="comparison-heading" tabindex="-1">Compare resume versions</h2><div class="comparison-grid"><div class="card"><h3>Earlier selected version</h3><p>${esc(comparisonVersionLabel(left))}</p></div><div class="card"><h3>Later selected version</h3><p>${esc(comparisonVersionLabel(right))}</p></div></div>${hasChanges?`<ul class="list" aria-label="Comparison summary">${result.observable_summary.map(summary=>`<li>${esc(summary)}</li>`).join("")}</ul>`:`<p><strong>No observable changes.</strong></p>`}${renderComparisonItems("Added statement",result.added)}${renderComparisonItems("Removed statement",result.removed)}${renderComparisonItems("Changed statement",result.chang     function clearComparison(){state.comparison={selectedRevisionIds:[],result:null,status:"idle",expandedUnchanged:false};renderHistory();focusPanel()}
    async function compareSelectedVersions(){const definitions=definitionHistory(),selected=state.comparison.selectedRevisionIds.map(revisionId=>definitions.find(item=>item.metadata.revision_id===revisionId)).filter(Boolean);if(selected.length!==2)return;state.comparison.status="loading";renderHistory();try{state.comparison.result=await capability("resume.definitions.read",{kind:"compare_definitions",left_revision_id:selected[0].metadata.revision_id,right_revision_id:selected[1].metadata.revision_id,left_expected_revision:selected[0].metadata.revision,right_expected_revision:selected[1].metadata.revision});state.comparison.status=state.comparison.result.result==="available"?"ready":"unavailable";renderHistory()}catch(error){state.comparison.status="idle";fail(error)}}
    function renderHistory(){const definitions=definitionHistory();if(state.comparison.result){renderComparisonResult(definitions);return}const selected=state.comparison.selectedRevisionIds;panel.innerHTML=`<h2>Resume history</h2><p>Saved versions are immutable. Select exactly two versions to compare; comparison does not change facts, resumes, or Career data.</p><div class="history-grid">${definitions.length?definitions.map(def=>{const label=comparisonVersionLabel(def),checked=selected.includes(def.metadata.revision_id);return `<label class="card history-option"><input type="checkbox" data-revision="${def.metadata.revision_id}" aria-label="Select ${esc(def.title)} ${esc(def.definition_kind)} version ${def.metadata.revision}" ${checked?"checked":""} ${!checked&&selected.length>=2?"disabled":""}><span><strong>${esc(def.title)}</strong><br><span class="small">${esc(def.definition_kind)} · ${esc(comparisonJobLabel(def))} · ${esc(def.status)} · ${esc(new Date(def.updated_at).toLocaleString())} · Version ${def.metadata.revision}</span></span></label>`}).join(""):`<p>No saved resume versions yet.</p>`}</div><p id="comparison-selection" role="status">${selected.length} version${selected.length===1?"":"s"} selected</p><div class="row"><button class="btn primary" id="compare-selected" ${selected.length!==2||state.comparison.status==="loading"?"disabled":""}>${state.comparison.status==="loading"?"Comparing…":"Compare selected versions"}</button><button class="btn" id="return">Return to current work</button></div>`;panel.querySelectorAll("[data-revision]").forEach(input=>input.onchange=()=>{const revisionId=input.dataset.revision,existing=state.comparison.selectedRevisionIds;state.comparison.selectedRevisionIds=existing.includes(revisionId)?existing.filter(id=>id!==revisionId):existing.length<2?[...existing,revisionId]:existing;state.comparison.status="idle";renderHistory();panel.querySelector(`[data-revision="${revisionId}"]`)?.focus()});$("compare-selected").onclick=()=>void compareSelectedVersions();$("return").onclick=()=>{state.comparison={selectedRevisionIds:[],result:null,status:"idle",expandedUnchanged:false};state.stage=deriveStage();render();focusPanel()}}
    window.addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc==="2.0"&&message.id!==undefined&&!message.method){const pending=state.rpcPending.get(message.id);if(!pending)return;state.rpcPending.delete(message.id);if(message.error)pending.reject(message.error);else pending.resolve(message.result);return}if(message?.jsonrpc==="2.0"&&message.method==="ui/resource-teardown"){cancelRecoveryTimer();for(const pending of state.pending.values()){if(pending.timer)clearTimeout(pending.timer);pending.reject({error:"session_closed"})}state.pending.clear();parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");return}if(message?.type==="host.chat.message"&&typeof message.payload?.text==="string"&&typeof message.payload?.messageId==="string"){void handleHostChatMessage(message.payload.text,message.payload.messageId);return}if(message?.type==="host.chat.action"&&typeof message.payload?.actionId==="string"){void handleHostChatAction(message.payload.actionId);return}if(message?.type==="host.chat.correction"){void handleHostChatCorrection();return}if(message?.type==="host.result"){const pending=state.pending.get(message.request_message_id);if(!pending)return;state.pending.delete(message.request_message_id);if(pending.timer)clearTimeout(pending.timer);if(message.error)pending.reject(message.error);else pending.resolve(message.response)}});

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Resume Builder</title>
  <style>
    :root{color-scheme:dark;--bg:#03050a;--card:#0a152a;--surface:#1e2a3b;--hover:#253448;--text:#c5daed;--muted:#7ca7d1;--subtle:#6687a8;--heading:#fff;--amber:#f5a623;--border:#294564;--danger:#f5365c;--success:#2dce89}
    *{box-sizing:border-box}html{min-width:320px;background:var(--bg)}body{min-width:320px;min-height:100vh;margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.shell{width:100%;max-width:1440px;margin:0 auto;padding:clamp(16px,2.25vw,36px)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:clamp(20px,2.5vw,32px)}.top>div{min-width:0}.eyebrow{margin:0;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}h1,h2,h3{color:var(--heading);line-height:1.2}h1{margin:5px 0;font-size:clamp(26px,2vw,32px)}h2{margin:0 0 10px;font-size:clamp(20px,1.6vw,24px)}h3{margin:0 0 8px;font-size:16px}.status{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(200px,240px) minmax(0,1fr);align-items:start;gap:clamp(16px,2vw,28px)}.steps,.panel,.card{border:1px solid var(--border);border-radius:12px;background:var(--card)}.steps{position:sticky;top:20px;height:max-content;padding:10px}.steps button{display:block;width:100%;min-height:42px;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:10px;text-align:left;font:inherit;cursor:pointer}.steps button:hover:not(:disabled){background:var(--hover);color:var(--heading)}.steps button[aria-current=step]{background:var(--surface);color:var(--heading)}.steps button:disabled{cursor:not-allowed;opacity:.55}.panel{min-width:0;min-height:clamp(520px,calc(100vh - 190px),760px);padding:clamp(20px,2.3vw,34px);overflow-wrap:anywhere}.panel>:first-child,.card>:first-child{margin-top:0}.panel>:last-child,.card>:last-child{margin-bottom:0}.card{padding:clamp(15px,1.5vw,20px);margin:18px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}.job-grid,.history-grid,.comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.history-option{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;margin:0;cursor:pointer}.history-option input{width:auto;margin:5px 0 0}.comparison-grid .card{margin:0}.comparison-list{padding-left:22px}.comparison-list li{margin:10px 0}.btn{min-height:42px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:9px 14px;font:inherit;cursor:pointer}.btn:hover{background:var(--hover)}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}.btn.primary{border-color:var(--amber);background:var(--amber);color:var(--bg);font-weight:700}.btn.primary:hover{background:#d4891c}.btn.danger{border-color:var(--danger)}.btn:disabled{cursor:not-allowed;opacity:.5}textarea,input,select{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:12px;font:inherit}textarea{min-height:150px;resize:vertical}label{display:block;margin:14px 0 7px;color:var(--heading);font-weight:600}.muted{color:var(--muted)}.small{font-size:13px}.progress{height:8px;overflow:hidden;border-radius:999px;background:var(--surface)}.progress span{display:block;height:100%;background:var(--amber)}.list{padding-left:20px}.warning{border-left:4px solid var(--amber)}.warning.error{border-left-color:var(--danger)}.warning.gap{border-left-color:var(--muted)}.resume{max-width:760px;margin:20px auto;overflow-wrap:anywhere;background:#fff;color:#111;padding:clamp(24px,3vw,40px);border-radius:4px}.resume p{margin:7px 0}.resume .resume-name{font-size:24px;font-weight:700;margin-bottom:10px}.resume .section{font-weight:700;text-transform:uppercase;margin-top:18px;border-bottom:1px solid #333}.resume .job-heading{font-weight:700;margin-top:14px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.alert{border:1px solid var(--danger);border-radius:8px;padding:12px;margin-bottom:18px}.success{border-color:var(--success)}
    @media(max-width:820px){.shell{padding:16px}.top{margin-bottom:20px}.layout{grid-template-columns:minmax(0,1fr)}.steps{position:static;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(145px,1fr);overflow-x:auto;scroll-snap-type:x proximity}.steps button{scroll-snap-align:start}.panel{min-height:500px;padding:20px}}
    @media(max-width:520px){html,body{min-width:0}.shell{padding:12px}.top{display:grid;gap:10px}.status{justify-self:start}.steps{grid-auto-columns:minmax(132px,44vw)}.panel{min-height:460px;padding:16px}.card{padding:14px;margin:14px 0}.row{align-items:stretch}.between>*{width:100%}.job-grid,.history-grid,.comparison-grid{grid-template-columns:minmax(0,1fr)}.btn{width:100%}textarea,input,select{font-size:16px}.resume{padding:20px}}
    @media(prefers-reduced-motion:no-preference){button{transition:background-color .15s ease}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">BrainDrive App</p><h1>Resume Builder</h1><p id="identity" class="muted">Loading your saved work…</p></div><span id="connection" class="status" role="status">Connecting securely…</span></header>
    <div id="alert" class="alert" role="alert" hidden></div>
    <div class="layout">
      <nav class="steps" aria-label="Resume progress" id="steps"></nav>
      <section class="panel" id="panel" tabindex="-1" aria-live="polite"><p>Connecting to BrainDrive…</p></section>
    </div>
  </main>
  <script>
  (()=>{
    "use strict";
    const APP_ID="ai.braindrive.resume-builder";
    const TOPICS=["contact","direction","employment","accomplishments","education","credentials","skills","projects","leadership_volunteer","links"];
    const JOB_DIMENSIONS=["responsibilities","accomplishments","outcomes","tools","scope","progression"];
    const RECOVERY_SETTLE_MS=1500,RECOVERY_ACK_TIMEOUT_MS=500;
    const STAGES=["preflight","interview","fact_review","general_review","job","evidence","tailored_review","revision","preview","history"];
    const LABELS={preflight:"Known information",interview:"Your experience",fact_review:"Review your information",general_review:"General resume",job:"Target job",evidence:"How you match",tailored_review:"Resume for this job",revision:"Revise",preview:"Preview & export",history:"History"};
    const state={boot:null,context:null,facts:[],workspace:null,stage:"preflight",topic:null,repeatTopic:null,repeatReturnsToReview:false,coaching:null,editFactId:null,pendingJobRevisionId:null,jobDimension:null,jobHistory:[],jobQuestion:null,jobAssistStatus:"idle",addingJob:false,sessionId:null,lastSubmittedTurnRevisionId:null,pending:new Map(),rpcPending:new Map(),rpcSequence:0,busy:false,error:null,jobAnalysis:null,evidence:null,preview:null,guidance:null,remembered:null,impact:null,revision:null,comparison:{selectedRevisionIds:[],result:null,status:"idle",expandedUnchanged:false},recovery:{timer:null,slot:null,value:"",valueDigest:null,status:"idle",ackRevision:null,ackAt:null,ackValueDigest:null,operationId:null,serverDraft:null,restorePending:false}};
    const $=id=>document.getElementById(id); const panel=$("panel");
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const uuid=()=>{const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
    function sha256Hex(value){
      const bytes=new TextEncoder().encode(value),length=bytes.length,total=Math.ceil((length+9)/64)*64,padded=new Uint8Array(total),view=new DataView(padded.buffer);
      padded.set(bytes);padded[length]=0x80;const bits=length*8;view.setUint32(total-8,Math.floor(bits/0x100000000));view.setUint32(total-4,bits>>>0);
      const constants=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      const words=new Uint32Array(64),hash=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),rotate=(word,count)=>(word>>>count)|(word<<(32-count));
      for(let offset=0;offset<total;offset+=64){for(let index=0;index<16;index++)words[index]=view.getUint32(offset+index*4);for(let index=16;index<64;index++){const x=words[index-15],y=words[index-2],s0=rotate(x,7)^rotate(x,18)^(x>>>3),s1=rotate(y,17)^rotate(y,19)^(y>>>10);words[index]=(words[index-16]+s0+words[index-7]+s1)>>>0}let[a,b,c,d,e,f,g,h]=hash;for(let index=0;index<64;index++){const s1=rotate(e,6)^rotate(e,11)^rotate(e,25),choose=(e&f)^(~e&g),temp1=(h+s1+choose+constants[index]+words[index])>>>0,s0=rotate(a,2)^rotate(a,13)^rotate(a,22),majority=(a&b)^(a&c)^(b&c),temp2=(s0+majority)>>>0;h=g;g=f;f=e;e=(d+temp1)>>>0;d=c;c=b;b=a;a=(temp1+temp2)>>>0}hash[0]=(hash[0]+a)>>>0;hash[1]=(hash[1]+b)>>>0;hash[2]=(hash[2]+c)>>>0;hash[3]=(hash[3]+d)>>>0;hash[4]=(hash[4]+e)>>>0;hash[5]=(hash[5]+f)>>>0;hash[6]=(hash[6]+g)>>>0;hash[7]=(hash[7]+h)>>>0}
      return "sha256:"+Array.from(hash,word=>word.toString(16).padStart(8,"0")).join("");
    }
    function envelope(type,payload,messageId=uuid()){return {bridge_version:1,message_id:messageId,type,payload}}
    function request(type,payload,options={}){const message=envelope(type,payload,options.messageId||uuid());return new Promise((resolve,reject)=>{let timer=null;if(options.timeout){timer=setTimeout(()=>{state.pending.delete(message.message_id);reject({error:"deadline_exceeded",ambiguous:true})},options.timeout)}state.pending.set(message.message_id,{resolve,reject,timer});parent.postMessage(message,"*")})}
    function rpcRequest(method,params){const id=`view-${++state.rpcSequence}`;return new Promise((resolve,reject)=>{state.rpcPending.set(id,{resolve,reject});parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
    function rpcNotify(method,params){parent.postMessage({jsonrpc:"2.0",method,params},"*")}
    async function connectBridge(){const initialized=await rpcRequest("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Resume Builder",version:"4.0.0",title:"Resume Builder"},appCapabilities:{availableDisplayModes:["inline"]}});state.boot={entry_point:initialized?.hostContext?.entryPoint==="career"?"career":"direct"};rpcNotify("ui/notifications/initialized",{});await request("bridge.ready",{supported_capabilities:[]});await reload()}
    async function capability(name,input,requestOperationId=null,timeout=null){const response=await request("capability.call",{capability:name,input,...(requestOperationId?{request_operation_id:requestOperationId}:{})},{timeout});return response?.result??response}
    function setBusy(value){state.busy=value;render()}
    function fail(error){state.busy=false;state.error=ownerError(error);render();$("alert").focus?.()}
    function ownerError(error){const code=String(error?.error||error?.code||"unavailable");const copy={conflict:"Your saved version changed elsewhere. Refresh and review before trying again.",model_incompatible:"Your active model is not yet compatible with this resume action. Choose a compatible model in BrainDrive Settings, then retry.",protocol_incompatible:"Your active model is not yet compatible with this resume action. Choose a compatible model in BrainDrive Settings, then retry.",provider_unavailable:"No compatible active model is available. Review BrainDrive Settings, then retry.",denied:"Your active provider needs attention. Review BrainDrive Settings, then retry.",quota_exceeded:"Your active provider has no available quota. Review its account, then retry.",rate_limited:"Your active provider is busy. Wait briefly, then retry.",deadline_exceeded:"The model request timed out. Your saved work is unchanged; retry when ready.",schema_validation_failed:"The model returned an invalid structured result. Your saved work is unchanged; retry when ready.",validation_failed:"Some wording is not supported by confirmed facts. Review the factual warnings and correct it.",cancelled:"The action was cancelled. Your last approved resume is unchanged.",session_closed:"The secure app session closed. Return to Apps and launch it again.",recoverable_internal_failure:"Resume Builder is temporarily unavailable. Your saved work is preserved; retry when ready."};const recovery=error?.recovery||(["model_incompatible","protocol_incompatible","provider_unavailable","denied"].includes(code)?"open_model_settings":null);return {code,message:copy[code]||"Resume Builder could not complete that action. Your saved work is preserved.",recovery}}
    function structuredValue(value){try{const parsed=JSON.parse(value);return parsed&&typeof parsed==="object"&&!Array.isArray(parsed)?parsed:null}catch{return null}}
    function topicForFact(fact){if(fact.fact_kind==="contact")return fact.value.startsWith("Professional link:")?"links":"contact";if(fact.fact_kind==="preference")return "direction";if(fact.fact_kind==="employment")return "employment";if(fact.fact_kind==="accomplishment")return "accomplishments";if(fact.fact_kind==="education")return "education";if(fact.fact_kind==="credential")return "credentials";if(fact.fact_kind==="skill")return "skills";if(fact.fact_kind==="job_evidence"){const value=structuredValue(fact.value);return value?.association==="general"&&value.dimension==="tools"&&value.outcome==="answered"?"skills":null}if(fact.fact_kind==="project")return fact.value.startsWith("Leadership or volunteer:")?"leadership_volunteer":"projects";return null}
    function factDisplayValue(fact){const value=structuredValue(fact.value);if(value?.format==="resume_job_v1"){const dates=[value.start_date,value.end_date].filter(Boolean).join(" to ");return [value.title,value.employer,value.location,dates,value.responsibilities].filter(Boolean).join(" · ")}if(value?.format==="resume_accomplishment_v1")return value.text||fact.value;if(value?.value_version===1&&fact.fact_kind==="job_evidence")return value.outcome==="answered"?value.owner_text:`${String(value.dimension).replaceAll("_"," ")}: ${String(value.outcome).replaceAll("_"," ")}`;return fact.value}
    function employmentFacts(){return state.facts.filter(f=>f.state==="confirmed"&&f.fact_kind==="employment")}
    function jobLabel(fact){const value=structuredValue(fact?.value);return value?.format==="resume_job_v1"?[value.title,value.employer].filter(Boolean).join(" at "):fact?factDisplayValue(fact).split(/[.;]/)[0]:"this job"}
    function activeJob(){const jobs=employmentFacts();return jobs.find(job=>job.metadata.revision_id===state.pendingJobRevisionId)||jobs.slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0]||null}
    function jobEvidence(jobRevisionId){const latestByDimension=new Map();for(const fact of state.facts.filter(f=>f.state==="confirmed"&&f.fact_kind==="job_evidence")){const value=structuredValue(fact.value);if(value?.association!=="job"||value.job_fact_revision_id!==jobRevisionId)continue;const current=latestByDimension.get(value.dimension);if(!current||Date.parse(fact.updated_at)>=Date.parse(current.fact.updated_at))latestByDimension.set(value.dimension,{fact,value})}return [...latestByDimension.values()]}
    function jobDimensionOutcomes(job){const outcomes={identity:"answered"};const value=structuredValue(job?.value);if(value?.responsibilities)outcomes.responsibilities="answered";for(const fact of state.facts.filter(f=>f.state==="confirmed"&&f.fact_kind==="accomplishment")){const parsed=structuredValue(fact.value);if(parsed?.job_fact_revision_id===job?.metadata?.revision_id)outcomes.accomplishments="answered"}for(const item of jobEvidence(job?.metadata?.revision_id)){outcomes[item.value.dimension]=item.value.outcome}return outcomes}
    function nextJobDimension(job){const outcomes=jobDimensionOutcomes(job);return JOB_DIMENSIONS.find(dimension=>outcomes[dimension]===undefined)||null}
    function jobProgress(job){const outcomes=jobDimensionOutcomes(job),complete=JOB_DIMENSIONS.filter(dimension=>outcomes[dimension]!==undefined).length;return {complete,total:JOB_DIMENSIONS.length,remaining:JOB_DIMENSIONS.length-complete,outcomes}}
    function knownJobSummary(job){const value=structuredValue(job?.value),items=[];if(value?.responsibilities)items.push(`Responsibilities: ${value.responsibilities}`);for(const item of jobEvidence(job?.metadata?.revision_id)){if(item.value.outcome==="answered")items.push(`${String(item.value.dimension).replaceAll("_"," ")}: ${item.value.owner_text}`)}for(const fact of state.facts.filter(f=>f.state==="confirmed"&&f.fact_kind==="accomplishment")){const parsed=structuredValue(fact.value);if(parsed?.job_fact_revision_id===job?.metadata?.revision_id)items.push(`accomplishments: ${parsed.text}`)}return items}
    function normalized(value){return String(value).normalize("NFKC").trim().replace(/\s+/g," ").toLocaleLowerCase("en-US")}
    function knownTopics(){return [...new Set(state.facts.filter(f=>f.state==="confirmed").map(topicForFact).filter(Boolean))]}
    function latest(type){return (state.workspace?.[type]||[]).slice().sort((a,b)=>b.metadata.revision-a.metadata.revision)[0]||null}
    function inactiveRevisionProposalIds(){return new Set((state.workspace?.revision_requests||[]).filter(request=>["rejected","regenerate","failed"].includes(request.state)).map(request=>request.resulting_definition_revision_id).filter(Boolean))}
    function general(approvedOnly=false){const inactive=inactiveRevisionProposalIds();return (state.workspace?.definitions||[]).filter(d=>d.definition_kind==="general"&&!inactive.has(d.metadata.revision_id)&&(!approvedOnly||d.status==="approved")).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0]||null}
    function targeted(approvedOnly=false){const inactive=inactiveRevisionProposalIds();return (state.workspace?.definitions||[]).filter(d=>d.definition_kind==="targeted"&&!inactive.has(d.metadata.revision_id)&&(!approvedOnly||d.status==="approved")).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0]||null}
    function latestRevisionRequest(){return (state.workspace?.revision_requests||[]).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at)||b.metadata.revision-a.metadata.revision)[0]||null}
    function revisionSource(){const id=state.revision?.request?.source_definition_revision_id;return (state.workspace?.definition_history||state.workspace?.definitions||[]).find(item=>item.metadata.revision_id===id)||null}
    function revisionProposal(){const id=state.revision?.request?.resulting_definition_revision_id;return (state.workspace?.definitions||[]).find(item=>item.metadata.revision_id===id)||null}
    function restoreRevision(){const request=latestRevisionRequest();if(!request||["accepted","edited","rejected"].includes(request.state)){state.revision=null;return}state.revision={request,classification:request.classification,clarification:request.clarification,mode:request.state,editing:false}}
    function progress(){const record=latest("interview");const done=new Set([...(record?.completed_topics||[]),...knownTopics()]);const skipped=new Set(record?.skipped_topics||[]);const durableCurrent=TOPICS.includes(record?.current_topic)?record.current_topic:null;return {record,done,skipped,next:state.repeatTopic||durableCurrent||TOPICS.find(t=>!done.has(t)&&!skipped.has(t))||null}}
    function recoveryDigest(value){return sha256Hex(JSON.stringify(value))}
    function recoveryOperationId(slot,valueDigest,expectedRevision){const digest=sha256Hex(JSON.stringify({slot,value_digest:valueDigest,expected_revision:expectedRevision})).slice(7).split("");digest[12]="4";digest[16]=["8","9","a","b"][parseInt(digest[16],16)%4];const value=digest.join("");return `${value.slice(0,8)}-${value.slice(8,12)}-${value.slice(12,16)}-${value.slice(16,20)}-${value.slice(20,32)}`}
    function sameSlot(left,right){return Boolean(left&&right&&left.session_id===right.session_id&&left.job_fact_revision_id===right.job_fact_revision_id&&left.question_id===right.question_id&&left.field_id===right.field_id)}
    function cancelRecoveryTimer(){if(state.recovery.timer){clearTimeout(state.recovery.timer);state.recovery.timer=null}}
    function restoreRecovery(record){state.lastSubmittedTurnRevisionId=record?.last_submitted_turn_revision_id||null;const draft=record?.recovery_draft;if(!draft){state.recovery={timer:null,slot:null,value:"",valueDigest:null,status:"idle",ackRevision:null,ackAt:null,ackValueDigest:null,operationId:null,serverDraft:null,restorePending:false};return}state.recovery={timer:null,slot:draft.slot,value:draft.value,valueDigest:draft.value_digest,status:"saved",ackRevision:draft.acknowledged_revision,ackAt:draft.saved_at,ackValueDigest:draft.value_digest,operationId:null,serverDraft:null,restorePending:true}}

    async function compareSelectedVersions(){const definitions=definitionHistory(),selected=state.comparison.selectedRevisionIds.map(revisionId=>definitions.find(item=>item.metadata.revision_id===revisionId)).filter(Boolean);if(selected.length!==2)return;state.comparison.status="loading";renderHistory();try{state.comparison.result=await capability("resume.definitions.read",{kind:"compare_definitions",left_revision_id:selected[0].metadata.revision_id,right_revision_id:selected[1].metadata.revision_id,left_expected_revision:selected[0].metadata.revision,right_expected_revision:selected[1].metadata.revision});state.comparison.status=state.comparison.result.result==="available"?"ready":"unavailable";renderHistory()}catch(error){state.comparison.status="idle";fail(error)}}
    function renderHistory(){const definitions=definitionHistory();if(state.comparison.result){renderComparisonResult(definitions);return}const selected=state.comparison.selectedRevisionIds;panel.innerHTML=`<h2>Resume history</h2><p>Saved versions are immutable. Select exactly two versions to compare; comparison does not change facts, resumes, or Career data.</p><div class="history-grid">${definitions.length?definitions.map(def=>{const label=comparisonVersionLabel(def),checked=selected.includes(def.metadata.revision_id);return `<label class="card history-option"><input type="checkbox" data-revision="${def.metadata.revision_id}" aria-label="Select ${esc(def.title)} ${esc(def.definition_kind)} version ${def.metadata.revision}" ${checked?"checked":""} ${!checked&&selected.length>=2?"disabled":""}><span><strong>${esc(def.title)}</strong><br><span class="small">${esc(def.definition_kind)} · ${esc(comparisonJobLabel(def))} · ${esc(def.status)} · ${esc(new Date(def.updated_at).toLocaleString())} · Version ${def.metadata.revision}</span></span></label>`}).join(""):`<p>No saved resume versions yet.</p>`}</div><p id="comparison-selection" role="status">${selected.length} version${selected.length===1?"":"s"} selected</p><div class="row"><button class="btn primary" id="compare-selected" ${selected.length!==2||state.comparison.status==="loading"?"disabled":""}>${state.comparison.status==="loading"?"Comparing…":"Compare selected versions"}</button><button class="btn" id="return">Return to current work</button></div>`;panel.querySelectorAll("[data-revision]").forEach(input=>input.onchange=()=>{const revisionId=input.dataset.revision,existing=state.comparison.selectedRevisionIds;state.comparison.selectedRevisionIds=existing.includes(revisionId)?existing.filter(id=>id!==revisionId):existing.length<2?[...existing,revisionId]:existing;state.comparison.status="idle";renderHistory();panel.querySelector(`[data-revision="${revisionId}"]`)?.focus()});$("compare-selected").onclick=()=>void compareSelectedVersions();$("return").onclick=()=>{state.comparison={selectedRevisionIds:[],result:null,status:"idle",expandedUnchanged:false};state.stage=deriveStage();render();focusPanel()}}
    window.addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc==="2.0"&&message.id!==undefined&&!message.method){const pending=state.rpcPending.get(message.id);if(!pending)return;state.rpcPending.delete(message.id);if(message.error)pending.reject(message.error);else pending.resolve(message.result);return}if(message?.jsonrpc==="2.0"&&message.method==="ui/resource-teardown"){cancelRecoveryTimer();for(const pending of state.pending.values()){if(pending.timer)clearTimeout(pending.timer);pending.reject({error:"session_closed"})}state.pending.clear();parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");return}if(message?.type==="host.result"){const pending=state.pending.get(message.request_message_id);if(!pending)return;state.pending.delete(message.request_message_id);if(pending.timer)clearTimeout(pending.timer);if(message.error)pending.reject(message.error);else pending.resolve(message.response)}});
    connectBridge().catch(fail);
  })();

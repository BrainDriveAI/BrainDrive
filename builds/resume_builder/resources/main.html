<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Resume Builder</title>
  <style>
    :root{color-scheme:dark;--bg:#03050a;--card:#0a152a;--surface:#1e2a3b;--hover:#253448;--text:#c5daed;--muted:#7ca7d1;--subtle:#6687a8;--heading:#fff;--amber:#f5a623;--border:#294564;--danger:#f5365c;--success:#2dce89}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}.shell{max-width:1000px;margin:0 auto;padding:20px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.eyebrow{margin:0;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}h1,h2,h3{color:var(--heading);line-height:1.2}h1{margin:4px 0;font-size:26px}h2{font-size:20px}h3{font-size:16px}.status{border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:13px}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.steps,.panel,.card{border:1px solid var(--border);border-radius:12px;background:var(--card)}.steps{padding:10px;height:max-content}.steps button{display:block;width:100%;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:10px;text-align:left}.steps button[aria-current=step]{background:var(--surface);color:var(--heading)}.steps button:disabled{opacity:.55}.panel{padding:20px;min-height:520px}.card{padding:14px;margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}.btn{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:9px 13px;font:inherit;cursor:pointer}.btn:hover,.btn:focus-visible{background:var(--hover)}.btn.primary{border-color:var(--amber);background:var(--amber);color:var(--bg);font-weight:700}.btn.danger{border-color:var(--danger)}.btn:disabled{cursor:not-allowed;opacity:.5}textarea,input{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:11px;font:inherit}textarea{min-height:120px;resize:vertical}label{display:block;margin:12px 0 6px;color:var(--heading);font-weight:600}.muted{color:var(--muted)}.small{font-size:13px}.progress{height:8px;overflow:hidden;border-radius:999px;background:var(--surface)}.progress span{display:block;height:100%;background:var(--amber)}.list{padding-left:20px}.warning{border-left:4px solid var(--amber)}.warning.error{border-left-color:var(--danger)}.warning.gap{border-left-color:var(--muted)}.resume{max-width:720px;margin:16px auto;background:#fff;color:#111;padding:32px;border-radius:4px}.resume p{margin:7px 0}.resume .section{font-weight:700;text-transform:uppercase;margin-top:18px;border-bottom:1px solid #333}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.alert{border:1px solid var(--danger);border-radius:8px;padding:12px;margin-bottom:12px}.success{border-color:var(--success)}
    @media(max-width:720px){.shell{padding:12px}.top{display:block}.status{display:inline-block;margin-top:8px}.layout{grid-template-columns:1fr}.steps{display:flex;overflow-x:auto}.steps button{min-width:max-content}.panel{padding:15px;min-height:460px}.resume{padding:20px}}
    @media(prefers-reduced-motion:no-preference){button{transition:background-color .15s ease}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">BrainDrive App</p><h1>Resume Builder</h1><p id="identity" class="muted">Loading your saved work…</p></div><span id="connection" class="status" role="status">Connecting securely…</span></header>
    <div id="alert" class="alert" role="alert" hidden></div>
    <div class="layout">
      <nav class="steps" aria-label="Resume progress" id="steps"></nav>
      <section class="panel" id="panel" tabindex="-1" aria-live="polite"><p>Connecting to BrainDrive…</p></section>
    </div>
  </main>
  <script>
  (()=>{
    "use strict";
    const APP_ID="ai.braindrive.resume-builder";
    const TOPICS=["contact","employment","accomplishments","education","skills"];
    const STAGES=["preflight","interview","fact_review","general_review","job","evidence","tailored_review","preview","history"];
    const LABELS={preflight:"Known context",interview:"Interview",fact_review:"Fact review",general_review:"General resume",job:"Target job",evidence:"Evidence",tailored_review:"Tailored resume",preview:"Preview & export",history:"History"};
    const state={boot:null,context:null,facts:[],workspace:null,stage:"preflight",topic:null,pending:new Map(),rpcPending:new Map(),rpcSequence:0,busy:false,error:null,jobAnalysis:null,evidence:null,preview:null};
    const $=id=>document.getElementById(id); const panel=$("panel");
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const uuid=()=>{const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
    function sha256Hex(value){
      const bytes=new TextEncoder().encode(value),length=bytes.length,total=Math.ceil((length+9)/64)*64,padded=new Uint8Array(total),view=new DataView(padded.buffer);
      padded.set(bytes);padded[length]=0x80;const bits=length*8;view.setUint32(total-8,Math.floor(bits/0x100000000));view.setUint32(total-4,bits>>>0);
      const constants=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      const words=new Uint32Array(64),hash=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),rotate=(word,count)=>(word>>>count)|(word<<(32-count));
      for(let offset=0;offset<total;offset+=64){for(let index=0;index<16;index++)words[index]=view.getUint32(offset+index*4);for(let index=16;index<64;index++){const x=words[index-15],y=words[index-2],s0=rotate(x,7)^rotate(x,18)^(x>>>3),s1=rotate(y,17)^rotate(y,19)^(y>>>10);words[index]=(words[index-16]+s0+words[index-7]+s1)>>>0}let[a,b,c,d,e,f,g,h]=hash;for(let index=0;index<64;index++){const s1=rotate(e,6)^rotate(e,11)^rotate(e,25),choose=(e&f)^(~e&g),temp1=(h+s1+choose+constants[index]+words[index])>>>0,s0=rotate(a,2)^rotate(a,13)^rotate(a,22),majority=(a&b)^(a&c)^(b&c),temp2=(s0+majority)>>>0;h=g;g=f;f=e;e=(d+temp1)>>>0;d=c;c=b;b=a;a=(temp1+temp2)>>>0}hash[0]=(hash[0]+a)>>>0;hash[1]=(hash[1]+b)>>>0;hash[2]=(hash[2]+c)>>>0;hash[3]=(hash[3]+d)>>>0;hash[4]=(hash[4]+e)>>>0;hash[5]=(hash[5]+f)>>>0;hash[6]=(hash[6]+g)>>>0;hash[7]=(hash[7]+h)>>>0}
      return "sha256:"+Array.from(hash,word=>word.toString(16).padStart(8,"0")).join("");
    }
    function envelope(type,payload,messageId=uuid()){return {bridge_version:1,message_id:messageId,type,payload}}
    function request(type,payload){const message=envelope(type,payload);return new Promise((resolve,reject)=>{state.pending.set(message.message_id,{resolve,reject});parent.postMessage(message,"*")})}
    function rpcRequest(method,params){const id=`view-${++state.rpcSequence}`;return new Promise((resolve,reject)=>{state.rpcPending.set(id,{resolve,reject});parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
    function rpcNotify(method,params){parent.postMessage({jsonrpc:"2.0",method,params},"*")}
    async function connectBridge(){const initialized=await rpcRequest("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Resume Builder",version:"3.0.0",title:"Resume Builder"},appCapabilities:{availableDisplayModes:["inline"]}});state.boot={entry_point:initialized?.hostContext?.entryPoint==="career"?"career":"direct"};rpcNotify("ui/notifications/initialized",{});await request("bridge.ready",{supported_capabilities:[]});await reload()}
    async function capability(name,input){const response=await request("capability.call",{capability:name,input});return response?.result??response}
    function setBusy(value){state.busy=value;render()}
    function fail(error){state.busy=false;state.error=ownerError(error);render();$("alert").focus?.()}
    function ownerError(error){const code=String(error?.error||error?.code||"unavailable");const copy={conflict:"Your saved version changed elsewhere. Refresh and review before trying again.",model_incompatible:"Your active model is not yet compatible with this resume action. Choose a compatible model in BrainDrive Settings, then retry.",protocol_incompatible:"Your active model is not yet compatible with this resume action. Choose a compatible model in BrainDrive Settings, then retry.",provider_unavailable:"No compatible active model is available. Review BrainDrive Settings, then retry.",denied:"Your active provider needs attention. Review BrainDrive Settings, then retry.",quota_exceeded:"Your active provider has no available quota. Review its account, then retry.",rate_limited:"Your active provider is busy. Wait briefly, then retry.",deadline_exceeded:"The model request timed out. Your saved work is unchanged; retry when ready.",schema_validation_failed:"The model returned an invalid structured result. Your saved work is unchanged; retry when ready.",validation_failed:"Some wording is not supported by confirmed facts. Review the factual warnings and correct it.",cancelled:"The action was cancelled. Your last approved resume is unchanged.",session_closed:"The secure app session closed. Return to Apps and launch it again.",recoverable_internal_failure:"Resume Builder is temporarily unavailable. Your saved work is preserved; retry when ready."};const recovery=error?.recovery||(["model_incompatible","protocol_incompatible","provider_unavailable","denied"].includes(code)?"open_model_settings":null);return {code,message:copy[code]||"Resume Builder could not complete that action. Your saved work is preserved.",recovery}}
    function knownTopics(){const map={contact:"contact",employment:"employment",accomplishment:"accomplishments",education:"education",skill:"skills",credential:"skills"};return [...new Set(state.facts.filter(f=>f.state==="confirmed").map(f=>map[f.fact_kind]).filter(Boolean))]}
    function latest(type){return (state.workspace?.[type]||[]).slice().sort((a,b)=>b.metadata.revision-a.metadata.revision)[0]||null}
    function general(approvedOnly=false){return (state.workspace?.definitions||[]).filter(d=>d.definition_kind==="general"&&(!approvedOnly||d.status==="approved")).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0]||null}
    function targeted(approvedOnly=false){return (state.workspace?.definitions||[]).filter(d=>d.definition_kind==="targeted"&&(!approvedOnly||d.status==="approved")).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0]||null}
    function progress(){const record=latest("interview");const done=new Set([...(record?.completed_topics||[]),...knownTopics()]);const skipped=new Set(record?.skipped_topics||[]);return {record,done,skipped,next:TOPICS.find(t=>!done.has(t)&&!skipped.has(t))||null}}
    function deriveStage(){if(targeted(true))return "preview";if(targeted())return "tailored_review";if((state.workspace?.jobs||[]).length&&general(true))return "evidence";if(general(true))return "job";if(general())return "general_review";const p=progress();if(p.record?.status==="completed"||p.record?.status==="review_needed")return "fact_review";return p.record?"interview":"preflight"}
    async function reload(){const [context,facts,workspace]=await Promise.all([capability("career.context.read",{entry_point:state.boot.entry_point}),capability("career.facts.read",{}),capability("resume.definitions.read",{view:"workspace"})]);state.context=context;state.facts=facts;state.workspace=workspace;state.stage=deriveStage();state.topic=progress().next;state.error=null;state.busy=false;render()}
    function render(){renderSteps();$("connection").textContent=state.boot?"Secure session active":"Connecting securely…";$("identity").textContent=state.boot?.entry_point==="career"?"Continuing from your Career context":"Direct resume workspace";const alert=$("alert");alert.hidden=!state.error;alert.textContent=state.error?state.error.message:"";if(state.error?.recovery==="open_model_settings"){const button=document.createElement("button");button.type="button";button.className="btn";button.textContent="Open BrainDrive Settings";button.onclick=()=>void request("host.action",{action:"navigate_settings",value:"models"}).catch(()=>undefined);alert.append(" ",button)}const views={preflight:renderPreflight,interview:renderInterview,fact_review:renderFacts,general_review:renderGeneral,job:renderJob,evidence:renderEvidence,tailored_review:renderTargeted,preview:renderPreview,history:renderHistory};(views[state.stage]||renderPreflight)();}
    function renderSteps(){const current=STAGES.indexOf(state.stage);$("steps").innerHTML=STAGES.map((stage,index)=>`<button type="button" data-stage="${stage}" ${stage===state.stage?'aria-current="step"':''} ${index>current+1?'disabled':''}>${esc(LABELS[stage])}</button>`).join("");$("steps").querySelectorAll("button:not(:disabled)").forEach(button=>button.addEventListener("click",()=>{state.stage=button.dataset.stage;render();focusPanel()}))}
    function focusPanel(){panel.focus({preventScroll:true})}
    function sourceSummary(){return (state.context?.sources||[]).map(source=>`<li><strong>${esc(source.source_kind.replaceAll("_"," "))}:</strong> ${source.status==="present"?"Available for your review":"No saved context found"}</li>`).join("")}
    function renderPreflight(){panel.innerHTML=`<h2>Start with what BrainDrive already knows</h2><p>Review the available context before adding anything. Known facts will be confirmed or corrected, not asked again as blank questions.</p><div class="card"><h3>Context preflight</h3><ul class="list">${sourceSummary()}</ul><p class="small muted">${state.facts.filter(f=>f.state==="confirmed").length} confirmed facts are ready. Unknown details will stay unknown unless you add them.</p></div><button class="btn primary" id="continue" ${state.busy?'disabled':''}>Continue to interview</button>`;$("continue").onclick=()=>{state.stage="interview";state.topic=progress().next;render();focusPanel()}}
    function renderInterview(){const p=progress();if(!p.next){state.stage="fact_review";render();return}const completed=p.done.size;panel.innerHTML=`<div class="row between"><div><h2>One topic at a time</h2><p class="muted">Topic ${Math.min(5,completed+1)} of 5 · ${p.skipped.size} skipped</p></div><button class="btn" id="pause">Pause</button></div><div class="progress" aria-label="Interview progress"><span style="width:${Math.round(completed/5*100)}%"></span></div><div class="card"><h3>${esc(p.next[0].toUpperCase()+p.next.slice(1))}</h3><p>${esc(questionFor(p.next))}</p><label for="answer">Your answer</label><textarea id="answer" maxlength="16000" placeholder="Enter only what you know. You can skip this topic."></textarea><div class="row"><button class="btn primary" id="confirm" ${state.busy?'disabled':''}>Review and confirm</button><button class="btn" id="skip" ${state.busy?'disabled':''}>Skip for now</button></div></div><p class="small muted">Your answer becomes a confirmed fact only after the BrainDrive confirmation appears.</p>`;$("confirm").onclick=()=>void saveAnswer(p.next);$("skip").onclick=()=>void saveProgress(p.next,"skip");$("pause").onclick=()=>void pauseInterview()}
    function questionFor(topic){return {contact:"Which contact details should appear on this resume?",employment:"What role or work experience should we include next?",accomplishments:"What outcome or accomplishment can you support with specific facts?",education:"What education or training should appear?",skills:"Which skills can you confirm from your experience?"}[topic]}
    async function saveAnswer(topic){const value=$("answer").value.trim();if(!value){state.error={message:"Add an answer or choose Skip for now."};render();return}try{setBusy(true);const digest=sha256Hex(value);const proposed=await capability("career.facts.propose",{source:{source_kind:"owner_interview",safe_label:"Resume interview",content_digest:digest,captured_at:new Date().toISOString()},fact:{fact_kind:topic==="accomplishments"?"accomplishment":topic==="skills"?"skill":topic==="contact"?"contact":topic==="education"?"education":"employment",state:"suggested",value,sensitivity:"sensitive"}});await capability("career.facts.confirm",{fact_record_id:proposed.fact.metadata.record_id,fact_revision_id:proposed.fact.metadata.revision_id,expected_revision:proposed.fact.metadata.revision,decision:"accept",edited_value:null,review_note:null});await saveProgress(topic,"complete")}catch(error){fail(error)}}
    async function saveProgress(topic,action){try{setBusy(true);const p=progress();const completed=[...p.done].filter(t=>!knownTopics().includes(t));const skipped=[...p.skipped];if(action==="complete"&&!completed.includes(topic))completed.push(topic);if(action==="skip"&&!skipped.includes(topic))skipped.push(topic);const next=TOPICS.find(t=>!new Set([...completed,...knownTopics()]).has(t)&&!skipped.includes(t))||null;await capability("resume.definitions.write",{kind:"interview_progress",progress:{...(p.record?{record_id:p.record.metadata.record_id,expected_revision:p.record.metadata.revision}:{expected_revision:null}),status:next?"in_progress":"review_needed",current_topic:next,completed_topics:completed,skipped_topics:skipped,draft_state:next?"declared_draft":"owner_reviewed"}});await reload()}catch(error){fail(error)}}
    async function pauseInterview(){try{setBusy(true);const p=progress();await capability("resume.definitions.write",{kind:"interview_progress",progress:{...(p.record?{record_id:p.record.metadata.record_id,expected_revision:p.record.metadata.revision}:{expected_revision:null}),status:"paused",current_topic:p.next,completed_topics:[...p.done].filter(t=>!knownTopics().includes(t)),skipped_topics:[...p.skipped],draft_state:"declared_draft"}});state.error={message:"Interview paused. Your progress is saved; reopen Resume Builder whenever you are ready."};state.busy=false;render()}catch(error){fail(error)}}
    function renderFacts(){const confirmed=state.facts.filter(f=>f.state==="confirmed");const proposed=state.facts.filter(f=>f.state!=="confirmed");panel.innerHTML=`<h2>Review confirmed facts</h2><p>Only confirmed items can support resume claims.</p><div class="card"><h3>Confirmed</h3>${confirmed.length?`<ul class="list">${confirmed.map(f=>`<li>${esc(f.value)} <span class="small muted">(${esc(f.fact_kind)})</span></li>`).join("")}</ul>`:"<p>No confirmed facts yet.</p>"}</div>${proposed.length?`<div class="card warning"><h3>Needs review</h3><p>${proposed.length} proposed or rejected items cannot support the resume.</p></div>`:""}<div class="row"><button class="btn" id="back">Continue interview</button><button class="btn primary" id="draft" ${!confirmed.length||state.busy?'disabled':''}>Create general draft</button></div>`;$("back").onclick=()=>{state.stage="interview";render()};$("draft").onclick=()=>void createGeneral()}
    async function infer(purpose,extra={}){const factIds=state.facts.filter(f=>f.state==="confirmed").map(f=>f.metadata.revision_id);const result=await capability("app.inference.request",{inference_contract_version:1,purpose,operation_id:uuid(),fact_revision_ids:factIds,record_revision_ids:extra.record_revision_ids||[],presentation_preferences:extra.presentation_preferences||{},derived_blocks:extra.derived_blocks||[]});if(result.status!=="completed")throw result.error||{error:"recoverable_internal_failure"};return result.result}
    async function createGeneral(){try{setBusy(true);const draft=await infer("general_resume_draft",{presentation_preferences:{template:"single_column",locale:"en-US"}});await capability("resume.definitions.write",{definition_kind:"general",status:"proposed",title:draft.title,statements:draft.statements.map(s=>({...s,section_id:s.section_id||"experience"})),section_order:draft.section_order,presentation_preferences:{template:"single_column"},locale:"en-US",page_intent:"two_pages",template_id:"resume.single-column",template_version:"1",parent_definition_revision_id:general()?.metadata.revision_id||null,job_revision_id:null,policy_version:"resume-policy-v1",prompt_policy_version:"1",variant:null});await reload()}catch(error){fail(error)}}
    function editor(definition,kind){const factual=definition.statements.map((s,index)=>`<div class="card"><label for="statement-${index}">${esc(s.section_id)} ${index+1}</label><textarea id="statement-${index}" data-index="${index}" maxlength="8192">${esc(s.text)}</textarea><div class="row"><button class="btn rewrite" data-index="${index}" data-action="accept">Accept</button><button class="btn rewrite" data-index="${index}" data-action="edit">Save edit</button><button class="btn rewrite" data-index="${index}" data-action="reject">Reject</button><button class="btn rewrite" data-index="${index}" data-action="regenerate">Regenerate</button></div></div>`).join("");panel.innerHTML=`<div class="row between"><div><h2>${kind==="general"?"General resume":"Tailored resume"}</h2><p class="muted">${kind==="general"?"Durable baseline":"Separate child version — the baseline is unchanged"}</p></div><span class="status">${esc(definition.status)}</span></div>${warningPanels()}${factual}<div class="row"><button class="btn" id="history">History</button><button class="btn primary" id="approve" ${state.busy?'disabled':''}>Validate and approve</button></div>`;panel.querySelectorAll(".rewrite").forEach(button=>button.onclick=()=>void rewriteAction(definition,Number(button.dataset.index),button.dataset.action));$("history").onclick=()=>{state.stage="history";render()};$("approve").onclick=()=>void approveDefinition(definition)}
    function warningPanels(){return `<div class="card warning error"><h3>Factual warnings</h3><p>Unsupported claims block approval. Owner edits are revalidated.</p></div><div class="card warning"><h3>Document warnings</h3><p>Length and logical order are checked during preview.</p></div><div class="card warning gap"><h3>Role evidence gaps</h3><p>Job requirements without confirmed evidence stay out of the resume.</p></div>`}
    function renderGeneral(){const definition=general();if(!definition){state.stage="fact_review";render();return}editor(definition,"general")}
    async function rewriteAction(definition,index,action){try{if(action==="reject"){state.error={message:"Proposal rejected. Your saved version was not changed."};render();return}if(action==="regenerate"){await createGeneral();return}const text=panel.querySelector(`[data-index="${index}"]`).value.trim();if(!text)throw {error:"validation_failed"};const statements=definition.statements.map((s,i)=>i===index?{...s,text}:s);setBusy(true);await capability("resume.definitions.write",{definition_kind:definition.definition_kind,status:"proposed",title:definition.title,statements,section_order:definition.section_order,presentation_preferences:definition.presentation_preferences,locale:definition.locale,page_intent:definition.page_intent,template_id:definition.template_id,template_version:definition.template_version,parent_definition_revision_id:definition.definition_kind==="general"?definition.metadata.revision_id:definition.parent_definition_revision_id,job_revision_id:definition.job_revision_id,policy_version:definition.policy_version,prompt_policy_version:definition.prompt_policy_version,variant:definition.definition_kind==="targeted"?variantFor(definition):null});await reload()}catch(error){fail(error)}}
    function variantFor(definition){const variant=(state.workspace?.variants||[]).find(v=>v.targeted_definition_revision_id===definition.metadata.revision_id);return variant?{evidence_matrix:variant.evidence_matrix,changed_statement_ids:variant.changed_statement_ids}:null}
    async function approveDefinition(definition){try{setBusy(true);await capability("resume.definitions.write",{kind:"approve_definition",definition_record_id:definition.metadata.record_id,expected_revision:definition.metadata.revision});await reload();const approved=definition.definition_kind==="general"?general(true):targeted(true);if(approved&&state.boot.entry_point==="career")await request("career.return",{summary:{summary_version:1,status:"completed",outcome_summary:definition.definition_kind==="general"?"General resume approved":"Tailored resume approved",approved_reference:{kind:definition.definition_kind==="general"?"general_resume":"tailored_variant",record_id:definition.definition_kind==="general"?approved.metadata.record_id:(state.workspace.variants.find(v=>v.targeted_definition_revision_id===approved.metadata.revision_id)||{}).metadata?.record_id,revision_id:definition.definition_kind==="general"?approved.metadata.revision_id:(state.workspace.variants.find(v=>v.targeted_definition_revision_id===approved.metadata.revision_id)||{}).metadata?.revision_id,safe_label:approved.title},stable_fact_proposals:[],next_career_action:"Review or export the approved resume",updated_at:new Date().toISOString()}})}catch(error){fail(error)}}
    function renderJob(){panel.innerHTML=`<h2>Paste the target job description</h2><p>The text is untrusted job data. It cannot change tools, provider settings, permissions, or confirmed facts.</p><label for="job-label">Role label</label><input id="job-label" maxlength="128" value="Target role"><label for="job-text">Job description</label><textarea id="job-text" maxlength="131072" placeholder="Paste the job description text"></textarea><button class="btn primary" id="analyze" ${state.busy?'disabled':''}>Analyze evidence</button>`;$("analyze").onclick=()=>void analyzeJob()}
    async function analyzeJob(){const text=$("job-text").value.trim();const label=$("job-label").value.trim();if(!text||!label){state.error={message:"Add a role label and pasted job description."};render();return}try{setBusy(true);const digest=sha256Hex(text);const saved=await capability("resume.jobs.write",{safe_label:label,description_text:text,content_digest:digest,captured_at:new Date().toISOString(),sensitivity:"sensitive"});const analysis=await infer("job_description_analyze",{record_revision_ids:[saved.job.metadata.revision_id]});const evidence=await infer("requirement_evidence_match",{record_revision_ids:[saved.job.metadata.revision_id],derived_blocks:[{category:"job_analysis",schema_id:"resume.job-analysis.v1",data:analysis}]});state.jobAnalysis=analysis;state.evidence=evidence;await reload();state.stage="evidence";render()}catch(error){fail(error)}}
    function evidenceRows(){const analysis=state.jobAnalysis?.requirements||[];const evidence=state.evidence?.evidence||[];return analysis.map(req=>{const match=evidence.find(e=>e.requirement_id===req.requirement_id)||{evidence_status:"clarification_needed",explanation:"More information is needed",supporting_confirmed_fact_revision_ids:[]};return {...req,...match}})}
    async function reanalyzeSavedJob(){try{setBusy(true);const job=latest("jobs");if(!job)throw {error:"validation_failed"};const analysis=await infer("job_description_analyze",{record_revision_ids:[job.metadata.revision_id]});const evidence=await infer("requirement_evidence_match",{record_revision_ids:[job.metadata.revision_id],derived_blocks:[{category:"job_analysis",schema_id:"resume.job-analysis.v1",data:analysis}]});state.jobAnalysis=analysis;state.evidence=evidence;state.busy=false;render()}catch(error){fail(error)}}
    function renderEvidence(){const rows=evidenceRows();panel.innerHTML=`<h2>Requirement evidence</h2><p>There is no match score. Each requirement keeps its own evidence status.</p>${rows.length?rows.map(row=>`<div class="card ${["unsupported","clarification_needed","ambiguous"].includes(row.evidence_status)?"warning gap":""}"><div class="row between"><strong>${esc(row.normalized_requirement||row.source_span||"Inferred requirement")}</strong><span class="status">${esc(row.evidence_status.replaceAll("_"," "))}</span></div><p>${esc(row.explanation||"")}</p></div>`).join(""):`<div class="card warning gap"><h3>Role evidence gaps</h3><p>The saved job description is available. Re-run evidence analysis to continue after reopening.</p><button class="btn primary" id="reanalyze" ${state.busy?'disabled':''}>Re-run evidence analysis</button></div>`}<div class="row"><button class="btn" id="back-job">Change job text</button><button class="btn primary" id="tailor" ${!rows.length||state.busy?'disabled':''}>Create tailored variant</button></div>`;$("reanalyze")&&($("reanalyze").onclick=()=>void reanalyzeSavedJob());$("back-job").onclick=()=>{state.stage="job";render()};$("tailor").onclick=()=>void createTargeted(rows)}
    async function createTargeted(rows){try{setBusy(true);const base=general(true);const job=latest("jobs");if(!base||!job)throw {error:"validation_failed"};const matrix=rows.map(row=>({requirement_id:row.requirement_id,requirement_kind:row.requirement_kind,evidence_status:row.evidence_status,source_span:row.source_span,inferred:row.inferred,supporting_confirmed_fact_revision_ids:row.supporting_confirmed_fact_revision_ids,clarification:row.clarification||null}));const draft=await infer("targeted_resume_draft",{record_revision_ids:[base.metadata.revision_id,job.metadata.revision_id],derived_blocks:[{category:"evidence_matrix",schema_id:"resume.requirement-evidence.v1",data:matrix}]});await capability("resume.definitions.write",{definition_kind:"targeted",status:"proposed",title:draft.title,statements:draft.statements.map(s=>({...s,section_id:s.section_id||"experience"})),section_order:draft.section_order,presentation_preferences:base.presentation_preferences,locale:base.locale,page_intent:base.page_intent,template_id:base.template_id,template_version:base.template_version,parent_definition_revision_id:base.metadata.revision_id,job_revision_id:job.metadata.revision_id,policy_version:"resume-policy-v1",prompt_policy_version:"1",variant:{evidence_matrix:matrix,changed_statement_ids:draft.changed_statement_ids}});await reload()}catch(error){fail(error)}}
    function renderTargeted(){const definition=targeted();if(!definition){state.stage="evidence";render();return}const base=general(true);panel.innerHTML=`<div class="card"><h3>Baseline comparison</h3><p><strong>General baseline:</strong> ${esc(base?.title||"Unavailable")} · approved and unchanged</p><p><strong>Tailored child:</strong> ${esc(definition.title)} · separate version</p></div>`;editor(definition,"targeted");panel.insertAdjacentHTML("afterbegin",`<div class="card"><h3>Baseline comparison</h3><p><strong>General baseline:</strong> ${esc(base?.title||"Unavailable")} · approved and unchanged</p><p><strong>Tailored child:</strong> ${esc(definition.title)} · separate version</p></div>`)}
    async function loadPreview(definition){try{setBusy(true);state.preview=await capability("resume.export.request",{action:"preview",definition_revision_id:definition.metadata.revision_id});state.busy=false;render()}catch(error){fail(error)}}
    function renderPreview(){const definition=targeted(true)||general(true);if(!definition){state.stage="general_review";render();return}if(!state.preview){panel.innerHTML=`<h2>Preview approved resume</h2><p>Preview is rendered by BrainDrive from the approved version. Rendered bytes are not the source of truth.</p><button class="btn primary" id="preview" ${state.busy?'disabled':''}>Create preview</button>`;$("preview").onclick=()=>void loadPreview(definition);return}panel.innerHTML=`<div class="row between"><div><h2>Preview</h2><p class="muted">${esc(state.preview.definition.kind)} · ${esc(state.preview.definition.revision_label)} · ${state.preview.page_count} page${state.preview.page_count===1?"":"s"}</p></div><span class="status">ATS parse-back passed</span></div><div class="resume" aria-label="Resume preview">${state.preview.lines.map((line,index)=>`<p class="${index>0&&!line.startsWith("-")?"section":""}">${esc(line)}</p>`).join("")}</div><div class="row"><button class="btn" id="history">History</button><button class="btn primary" id="export">Export PDF</button></div><p class="small muted">BrainDrive handles the browser save action. Resume Builder never receives a filesystem path.</p>`;$("history").onclick=()=>{state.stage="history";render()};$("export").onclick=()=>void request("export.request",{definition_revision_id:definition.metadata.revision_id,safe_filename:"resume.pdf",destination_intent:"new_download",overwrite_confirmed:false}).then(result=>{state.error={message:`Export ready: ${result.safe_destination_label}. Your approved resume remains saved.`};render()}).catch(fail)}
    function renderHistory(){const definitions=(state.workspace?.definitions||[]).slice().sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at));panel.innerHTML=`<h2>Resume history</h2><p>Saved versions are immutable. Reopening one does not change confirmed facts or the approved baseline.</p>${definitions.length?definitions.map(def=>`<button class="card btn history-item" data-id="${def.metadata.record_id}"><strong>${esc(def.title)}</strong><br><span class="small">${esc(def.definition_kind)} · ${esc(def.status)} · Version ${def.metadata.revision}</span></button>`).join(""):`<p>No saved resume versions yet.</p>`}<button class="btn" id="return">Return to current work</button>`;panel.querySelectorAll(".history-item").forEach(button=>button.onclick=()=>{const def=definitions.find(item=>item.metadata.record_id===button.dataset.id);state.stage=def?.definition_kind==="targeted"?"tailored_review":"general_review";render()});$("return").onclick=()=>{state.stage=deriveStage();render()}}
    window.addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc==="2.0"&&message.id!==undefined&&!message.method){const pending=state.rpcPending.get(message.id);if(!pending)return;state.rpcPending.delete(message.id);if(message.error)pending.reject(message.error);else pending.resolve(message.result);return}if(message?.jsonrpc==="2.0"&&message.method==="ui/resource-teardown"){for(const pending of state.pending.values())pending.reject({error:"session_closed"});state.pending.clear();parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");return}if(message?.type==="host.result"){const pending=state.pending.get(message.request_message_id);if(!pending)return;state.pending.delete(message.request_message_id);if(message.error)pending.reject(message.error);else pending.resolve(message.response)}});
    connectBridge().catch(fail);
  })();
  </script>

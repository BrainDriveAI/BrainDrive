title = "BrainDrive secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "braindrive-labeled-secret-access-key"
description = "Detected a labeled secret access key in repository content."
regex = '''(?i)secret[ _-]?access[ _-]?key[ \t]*[:=][ \t]*[`'"]?([A-Za-z0-9+/=_-]{16,})'''
secretGroup = 1
keywords = ["secret"]
